<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AEC Digital Printers — Accounts Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6B84D1">
<style>
  :root{
    --paper:#F9F8FC;
    --ink:#3F3B54;
    --ink-soft:#837FA0;
    --rule:#E6E1F2;
    --accent:#6B84D1;
    --accent-soft:#E7ECFB;
    --amber:#C99A4E;
    --amber-soft:#FBF1DE;
    --bad:#D97A93;
    --bad-soft:#FBE9EE;
    --good:#6FA88C;
    --card:#FFFFFF;
    --shadow:0 1px 2px rgba(63,59,84,.06), 0 6px 18px rgba(63,59,84,.07);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--body-font, 'Inter', system-ui, sans-serif); -webkit-font-smoothing:antialiased;}
  .disp{ font-family:var(--display-font, 'Space Grotesk', sans-serif); font-weight:700;}
  .num{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}
  .app{ display:flex; min-height:100vh;}

  .sidebar{ width:216px; flex-shrink:0; background:var(--ink); color:#E7E9F2; padding:22px 16px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column;}
  .brand{ display:flex; align-items:center; gap:9px; margin-bottom:4px;}
  .brand .mark{ width:28px; height:28px; border-radius:7px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; color:#fff; font-size:15px;}
  .brand .name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:16px; color:#F4F2E9;}
  .biz{ font-size:12px; color:#9AA3BE; padding:12px 2px 18px; border-bottom:1px solid #2B3457; margin-bottom:14px; line-height:1.5;}
  .biz b{ color:#E7E9F2; display:block; font-size:13.5px; margin-bottom:2px;}
  nav{ display:flex; flex-direction:column; gap:7px; flex:1;}
  nav button{ all:unset; cursor:pointer; padding:12px 14px; border-radius:8px; font-size:13.5px; font-weight:500; color:#B7BEDA; display:flex; align-items:center; gap:10px;}
  nav button .ico{ width:16px; text-align:center; font-size:14px;}
  nav button:hover{ background:#232C50; color:#F4F2E9;}
  nav button.active{ background:var(--accent); color:#fff; font-weight:700;}
  .side-foot{ font-size:10.5px; color:#7C84A3; line-height:1.5; padding-top:14px; border-top:1px solid #2B3457;}

  main{ flex:1; padding:28px 34px 60px; max-width:1180px;}
  .topbar{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
  .topbar h1{ font-family:'Space Grotesk',sans-serif; font-size:25px; margin:0; font-weight:700;}
  .topbar .sub{ color:var(--ink-soft); font-size:13px; margin-top:3px;}
  .today{ font-size:12px; color:var(--ink-soft); text-align:right;}

  .grid.cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:22px;}
  .card{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px; position:relative; overflow:hidden;}
  .card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent);}
  .card.bad::before{ background:var(--bad);}
  .card.amber::before{ background:var(--amber);}
  .card .label{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft); font-weight:600;}
  .card .value{ font-family:'JetBrains Mono',monospace; font-size:23px; font-weight:700; margin-top:6px;}
  .card .foot{ font-size:11.5px; color:var(--ink-soft); margin-top:4px;}

  .panel{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:22px 24px; margin-bottom:20px;}
  .panel h2{ font-family:'Space Grotesk',sans-serif; font-size:16.5px; margin:0 0 12px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .panel h2 .tag{ font-family:'Inter',sans-serif; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.7px; color:var(--accent); background:var(--accent-soft); padding:3px 8px; border-radius:20px;}
  .two-col{ display:grid; grid-template-columns:1.2fr 1fr; gap:18px; align-items:start;}
  @media (max-width:920px){ .two-col{ grid-template-columns:1fr;} main{padding:20px 14px 50px;} .app{flex-direction:column;} .sidebar{width:100%; height:auto; position:relative; flex-direction:row; flex-wrap:wrap;} nav{flex-direction:row; flex-wrap:wrap;} .side-foot,.biz{display:none;} }
  /* Horizontal "T-account" layout for Trading Account / P&L / Balance Sheet — two sides shown
     side-by-side (Dr | Cr, or Assets | Capital & Liabilities). Collapses to stacked on narrow
     screens, same breakpoint as .two-col, so it stays usable on mobile. */
  .t-format{ display:grid; grid-template-columns:1fr 1fr; gap:0 24px; align-items:start;}
  .t-format .t-side{ min-width:0;}
  .t-format .t-side.t-right{ border-left:1px solid var(--rule); padding-left:24px;}
  @media (max-width:920px){ .t-format{ grid-template-columns:1fr; gap:20px 0;} .t-format .t-side.t-right{ border-left:none; padding-left:0; border-top:1px solid var(--rule); padding-top:16px;} }
  .t-format table{ width:100%; border-collapse:collapse; font-size:13px;}
  .t-format thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); padding:4px 6px; font-weight:600; border-bottom:1px solid var(--rule);}
  .t-format thead th.num{ text-align:right;}
  .t-format tbody td{ padding:6px; border-bottom:1px dashed var(--rule);}
  .t-format tfoot td{ padding:7px 6px; border-top:2px solid var(--ink); font-weight:700;}

  table{ width:100%; border-collapse:collapse; font-size:13px;}
  thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-soft); border-bottom:1px solid var(--rule); padding:7px 8px; font-weight:600;}
  tbody td{ padding:10px 10px; border-bottom:1px dashed var(--rule); vertical-align:middle;}
  tbody tr:hover{ background:#FBFAF6;}
  td.num, th.num{ text-align:right; font-family:'JetBrains Mono',monospace;}
  .muted{ color:var(--ink-soft);}
  .pill{ display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:600;}
  /* Row action menu — consolidates Invoice/Mark received/Edit/Delete/Credit note into one "⋯" button per row */
  .row-actions{ position:relative; display:inline-block; }
  .row-menu-toggle{ all:unset; cursor:pointer; padding:6px 10px; border-radius:7px; border:1px solid var(--rule); font-size:15px; line-height:1; color:var(--ink-soft);}
  .row-menu-toggle:hover{ background:var(--card2,#f4f2ea);}
  .row-menu{ display:none; position:absolute; right:0; top:calc(100% + 4px); background:#fff; border:1px solid var(--rule); border-radius:9px; box-shadow:var(--shadow); min-width:180px; z-index:60; padding:6px; flex-direction:column; gap:2px;}
  .row-menu.open{ display:flex;}
  .row-menu button{ all:unset; cursor:pointer; padding:8px 10px; border-radius:6px; font-size:13px; color:var(--ink); white-space:nowrap;}
  .row-menu button:hover{ background:var(--card2,#f4f2ea);}
  .row-menu button.danger{ color:#b42318;}
  .pill.in{ background:var(--accent-soft); color:var(--accent);}
  .pill.out{ background:var(--bad-soft); color:var(--bad);}
  .pill.pill-total{ font-size:15px; padding:4px 10px;}
  .gst-preview-note{ font-size:14px; font-weight:600; color:var(--ink);}

  form.inline, .inline{ display:grid; gap:22px 26px; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); align-items:end; margin-bottom:18px;}
  label{ font-size:13px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.4px; display:block; margin-bottom:7px;}
  input,select{ width:100%; padding:9px 11px; border:1px solid var(--rule); border-radius:7px; font-size:13.5px; font-family:'Inter',sans-serif; background:#FFFEFC; color:var(--ink);}
  input:focus,select:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);}
  input[type=number]{ font-family:'JetBrains Mono',monospace;}
  button.btn{ all:unset; cursor:pointer; text-align:center; background:var(--ink); color:#F4F2E9; font-weight:600; font-size:13px; padding:9px 16px; border-radius:8px;}
  button.btn:hover{ background:#232C50;}
  button.btn.primary{ background:var(--accent); color:#fff;}
  button.btn.primary:hover{ filter:brightness(1.07);}
  button.btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--rule);}
  button.btn.danger{ background:var(--bad); color:#fff;}
  button.btn.small{ padding:5px 10px; font-size:11.5px; border-radius:6px;}
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .empty{ padding:24px 10px; text-align:center; color:var(--ink-soft); font-size:13px;}
  .toast{ position:fixed; bottom:20px; right:20px; background:var(--ink); color:#F4F2E9; padding:11px 18px; border-radius:8px; font-size:13px; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:.25s; pointer-events:none; z-index:50; max-width:320px;}
  .toast.show{ opacity:1; transform:translateY(0);}
  .chip-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .chip{ display:flex; align-items:center; gap:7px; background:var(--paper); border:1px solid var(--rule); border-radius:20px; padding:5px 6px 5px 12px; font-size:12.5px;}
  .chip button{ all:unset; cursor:pointer; width:18px; height:18px; border-radius:50%; background:var(--bad-soft); color:var(--bad); font-size:12px; display:flex; align-items:center; justify-content:center; font-weight:700;}
  .chip.acc{ padding-left:10px;}
  .chip .bal{ font-family:'JetBrains Mono',monospace; color:var(--ink-soft);}
  .field-note{ font-size:11px; color:var(--ink-soft); margin-top:5px;}
  .settings-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px;}
  .statement{ max-width:640px;}
  .statement .line{ display:flex; justify-content:space-between; padding:6px 2px; border-bottom:1px dashed var(--rule); font-size:13.5px;}
  .statement .line.sub{ padding-left:14px; color:var(--ink-soft); font-size:12.5px;}
  .statement .line.total{ border-bottom:2px solid var(--ink); border-top:1px solid var(--ink); font-weight:700; margin-top:4px;}
  .statement .section-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13.5px; margin:14px 0 2px; color:var(--accent);}
  .statement summary{ list-style:none; cursor:pointer;}
  .statement summary::-webkit-details-marker{ display:none;}
  .statement summary::after{ content:'▾'; font-size:10px; margin-left:6px; color:var(--ink-soft);}
  .statement details[open] summary::after{ content:'▴';}
  .statement .breakdown-list{ background:var(--accent-soft, #f4f6fb); border-radius:6px; margin:2px 0 6px 14px; padding:2px 0;}
  .tabs-sub{ display:flex; gap:6px; margin-bottom:14px;}
  .tabs-sub button{ all:unset; cursor:pointer; padding:7px 14px; border-radius:20px; font-size:12.5px; font-weight:600; color:var(--ink-soft); border:1px solid var(--rule);}
  .tabs-sub button.active{ background:var(--ink); color:#fff; border-color:var(--ink);}

  /* Collapsible Reports panels — <details>/<summary> wrapping an existing .panel, closed by default;
     clicking the heading (the summary) expands it. Scoped to .report-collapse only, so ordinary .panel
     usage elsewhere in the app (Dashboard, Sales, Settings, etc.) is untouched.
     The collapse arrow lives on <summary> itself (absolutely positioned), NOT inside the <h2> — the h2 is
     a flex row of [title, tag badge] and putting a 3rd flex item (the arrow) in there made justify-content:
     space-between center the title between the arrow and the badge instead of anchoring it left, and since
     each panel's badge text is a different length, every heading landed in a different spot. Keeping the
     h2 to exactly 2 flex children keeps every panel's title flush left and aligned with the others. */
  details.report-collapse{ padding:0;}
  details.report-collapse > summary{ list-style:none; cursor:pointer; padding:22px 24px 22px 40px; position:relative;}
  details.report-collapse > summary::-webkit-details-marker{ display:none;}
  details.report-collapse > summary::before{ content:'▸'; position:absolute; left:22px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:13px; transition:transform .15s;}
  details.report-collapse[open] > summary::before{ transform:translateY(-50%) rotate(90deg);}
  details.report-collapse > summary h2{ margin:0; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; text-align:left;}
  details.report-collapse > summary:hover{ background:#FBFAF6;}
  details.report-collapse > .report-collapse-body{ padding:0 24px 22px 40px;}

  .inv-modal{ display:none; position:fixed; inset:0; background:rgba(22,33,62,.6); z-index:200; align-items:flex-start; justify-content:center; overflow:auto; padding:26px 16px;}
  @page { size: A4; margin: 0; }
  .inv-actions{ position:sticky; top:0; display:flex; justify-content:flex-end; gap:10px; margin-bottom:12px; width:210mm; max-width:100%;}
  .inv-sheet{ background:#F7ECE4; color:#000; width:210mm; max-width:100%; min-height:297mm; padding:14mm; box-shadow:var(--shadow); font-family:Calibri,Arial,sans-serif; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
  .inv-sheet table{ border-collapse:collapse;}
  .inv-pages{ display:flex; flex-direction:column; align-items:center; gap:20px;}
  .inv-sheet--col{ display:flex; flex-direction:column;}
  .inv-sheet--break{ break-before:page; page-break-before:always;}
  .inv-spacer{ flex:1; min-height:0;}
  .inv-items-tbl tr{ break-inside:avoid; page-break-inside:avoid;}
  .party-modal{ display:none; position:fixed; inset:0; background:rgba(22,33,62,.6); z-index:220; align-items:center; justify-content:center; padding:16px;}
  .party-card{ background:#fff; color:var(--ink); width:420px; max-width:100%; border-radius:12px; padding:20px 22px; box-shadow:var(--shadow);}
  .party-card h3{ font-family:'Space Grotesk',sans-serif; font-size:16px; margin:0 0 14px;}
  .party-card .row{ margin-top:14px; justify-content:flex-end;}
  .party-card.wide{ width:640px; max-height:88vh; overflow-y:auto; }
  .im-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px 14px; }
  .im-grid .span2{ grid-column:1/-1; }
  @media (max-width:460px){ .im-grid{ grid-template-columns:1fr; } }
  .line-tbl{ width:100%; border-collapse:collapse; font-size:13px; margin-top:10px;}
  .line-tbl th{ text-align:left; font-size:12.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); padding:8px 10px; font-weight:600;}
  .line-tbl td{ padding:9px 10px; vertical-align:middle;}
  .line-tbl input, .line-tbl select{ padding:8px 10px; font-size:13px;}
  .line-tbl td.linenum{ width:32px; text-align:center; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; font-size:12px;}
  .line-tbl td.lineqty, .line-tbl td.linerate, .line-tbl td.lineamt{ width:90px;}
  .line-tbl td.linegst{ width:80px;}
  .line-tbl td.linermv{ width:30px; text-align:center;}
  @media print{
    body > *:not(.inv-modal){ display:none !important;}
    .inv-modal{ display:block; position:static; background:#fff; padding:0;}
    .inv-actions{ display:none;}
    .inv-pages{ display:block;}
    .inv-sheet{ box-shadow:none; margin:0;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="mark">A</div><div class="name">Accounts Book</div></div>
    <div class="biz"><b id="bizName">Your Business</b>Simple books for small &amp; medium businesses</div>
    <nav id="nav">
      <button data-tab="dashboard" class="active"><span class="ico">◆</span> Dashboard</button>
      <button data-tab="cashflow"><span class="ico">⌁</span> Cash Flow</button>
      <button data-tab="inventory"><span class="ico">▢</span> Inventory</button>
      <button data-tab="sales"><span class="ico">↗</span> Sales</button>
      <button data-tab="purchases"><span class="ico">↙</span> Purchases</button>
      <button data-tab="general"><span class="ico">≡</span> Journal Entry</button>
      <button data-tab="reports"><span class="ico">▤</span> Reports</button>
      <button data-tab="reconcile"><span class="ico">⇄</span> Reconcile</button>
      <button data-tab="settings"><span class="ico">⚙</span> Settings</button>
    </nav>
    <div class="side-foot">Google Drive sync: <span id="driveStatus">not connected</span><br>A local copy is also kept in this browser.<br><a href="#" onclick="driveSignOut(); return false;" style="color:#C33;">Sign out</a></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div id="signinGate" style="display:none; position:fixed; inset:0; background:rgba(22,33,62,.94); z-index:500; align-items:center; justify-content:center; flex-direction:column; color:#fff; text-align:center; padding:20px;">
  <div style="font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; margin-bottom:10px;">AEC Digital Printers</div>
  <div style="max-width:360px; margin-bottom:22px; color:#B7BEDA; font-size:14px;">Sign in with the Google account this business's data should sync to, so it stays the same on every device.</div>
  <button class="btn primary" style="padding:12px 28px;" onclick="driveSignIn()">Sign in with Google</button>
  <div id="signinNote" style="margin-top:16px; font-size:12px; color:#7C84A3; max-width:340px;"></div>
</div>

<script>
/* ============================= GOOGLE DRIVE SYNC CONFIG =============================
   Fill in GOOGLE_CLIENT_ID with the OAuth Client ID from your own Google Cloud project (see the
   setup guide). Everything else below works automatically once that's filled in — nothing else
   in this file needs to change for sync to work. */
const GOOGLE_CLIENT_ID = '679517527922-qlc22rfaqp099c543gd1rfbj6ia33lhr.apps.googleusercontent.com';
const DRIVE_FOLDER_NAME = 'AEC Digital Printers — App Data';
const DRIVE_FILE_NAME = 'accounts-data.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

/* ============================= DATA LAYER ============================= */
const STORAGE_KEY = 'accounts_book_v2_digital_printing';
const RECEIVABLE_ACCOUNT = 'Accounts Receivable (Pending)';
const PAYABLE_ACCOUNT = 'Accounts Payable (Pending)';
const CREDIT_NOTE_CATEGORY = 'Sales Returns / Credit Notes';
const PURCHASE_RETURN_CATEGORY = 'Purchase Returns / Debit Notes';

/* ============================= APPEARANCE (color themes + fonts) =============================
   10 selectable color options total: 9 named preset palettes below, plus "Custom" (a 6-swatch
   builder in Settings that derives the lighter -soft/rule/ink-soft tones automatically). Lavender
   matches the app's shipped default exactly, so picking it is a visual no-op. Fonts: 4 common presets
   plus "Custom" (upload your own font file). Both are saved with the business's data and re-applied
   on every load via applySavedTheme()/applyFontChoice() (see INIT at the bottom of this file). */
const COLOR_PRESETS = {
  Blue:     { paper:'#F5F8FF', ink:'#132038', inkSoft:'#5F6C8A', rule:'#DCE4F5', accent:'#2F6FED', accentSoft:'#E4ECFE', amber:'#C98A2C', amberSoft:'#F5E9D5', bad:'#C4384A', badSoft:'#F6E1E4', good:'#1E8E5A' },
  Gold:     { paper:'#FCFAF3', ink:'#332B14', inkSoft:'#8A7B4E', rule:'#EDE3C4', accent:'#B8860B', accentSoft:'#F5EBCE', amber:'#C98A2C', amberSoft:'#F5E9D5', bad:'#B23A48', badSoft:'#F6E1E3', good:'#5C7A2E' },
  Silver:   { paper:'#F7F7F8', ink:'#2A2E33', inkSoft:'#767C85', rule:'#DCDEE2', accent:'#6E7480', accentSoft:'#E7E9EC', amber:'#C98A2C', amberSoft:'#F5E9D5', bad:'#B23A48', badSoft:'#F6E1E3', good:'#3E7C5A' },
  Yellow:   { paper:'#FDFBEF', ink:'#332E10', inkSoft:'#8C813C', rule:'#F0E7B8', accent:'#D9A916', accentSoft:'#FBF1CC', amber:'#C98A2C', amberSoft:'#F5E9D5', bad:'#B23A48', badSoft:'#F6E1E3', good:'#5C8A2E' },
  Peach:    { paper:'#FEF7F2', ink:'#3A2A20', inkSoft:'#977A66', rule:'#F5DFCB', accent:'#E58A5D', accentSoft:'#FCE9DC', amber:'#C98A2C', amberSoft:'#F5E9D5', bad:'#C4384A', badSoft:'#F6E1E4', good:'#4E8A5E' },
  Lavender: { paper:'#F9F8FC', ink:'#3F3B54', inkSoft:'#837FA0', rule:'#E6E1F2', accent:'#6B84D1', accentSoft:'#E7ECFB', amber:'#C99A4E', amberSoft:'#FBF1DE', bad:'#D97A93', badSoft:'#FBE9EE', good:'#6FA88C' },
  Green:    { paper:'#F5FAF6', ink:'#1B2E22', inkSoft:'#5E7C6A', rule:'#D9EDE0', accent:'#2C8A5B', accentSoft:'#DCF1E4', amber:'#C98A2C', amberSoft:'#F5E9D5', bad:'#B23A48', badSoft:'#F6E1E3', good:'#2C8A5B' },
  Orange:   { paper:'#FFF8F2', ink:'#3A2712', inkSoft:'#96754D', rule:'#F5DCC0', accent:'#E06B1F', accentSoft:'#FBE4D0', amber:'#C98A2C', amberSoft:'#F5E9D5', bad:'#C4384A', badSoft:'#F6E1E4', good:'#4E8A5E' },
  Pink:     { paper:'#FEF6F8', ink:'#3A222A', inkSoft:'#996C7C', rule:'#F5D6E1', accent:'#D9497B', accentSoft:'#FBE1EA', amber:'#C98A2C', amberSoft:'#F5E9D5', bad:'#C4384A', badSoft:'#F6E1E4', good:'#4E8A5E' }
};
const FONT_PRESETS = {
  Inter: "'Inter',system-ui,sans-serif",

/* ============================= GOOGLE DRIVE SYNC =============================
   Keeps your data in your own Google Drive (in a folder named DRIVE_FOLDER_NAME above) so it's
   the same on every device you sign in on. The local copy in this browser (above) still works
   exactly as before — Drive sync just layers automatic cross-device backup on top of it. Whichever
   copy (local vs Drive) was saved more recently wins when the app opens, so an offline device never
   silently overwrites newer work done elsewhere. */
let gDriveReady = false, gDriveFileId = null, gAccessToken = null, gTokenClient = null, gDriveSaveTimer = null;
function driveStatus(msg){ const el = document.getElementById('driveStatus'); if(el) el.textContent = msg; }
function initGoogleAuth(){
  if(GOOGLE_CLIENT_ID.indexOf('PASTE_YOUR_CLIENT_ID_HERE')===0){
    driveStatus('not set up yet');
    const note = document.getElementById('signinNote');
    if(note) note.textContent = 'Sync isn\'t configured yet — see the setup guide to add your Google Client ID.';
    return;
  }
  if(!window.google || !window.google.accounts){ setTimeout(initGoogleAuth, 300); return; }
  gTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp)=>{
      if(resp.error){ driveStatus('sign-in failed — try again'); return; }
      gAccessToken = resp.access_token;
      onDriveSignedIn();
    }
  });
  const gate = document.getElementById('signinGate');
  if(gate) gate.style.display = 'flex';
}
function driveSignIn(){
  if(!gTokenClient){ driveStatus('still loading — try again in a second'); return; }
  gTokenClient.requestAccessToken({prompt: gAccessToken ? '' : 'consent'});
}
function driveApi(path, opts={}){
  opts.headers = Object.assign({'Authorization':'Bearer '+gAccessToken}, opts.headers||{});
  return fetch('https://www.googleapis.com/drive/v3/'+path, opts).then(r=>{
    if(!r.ok) return r.text().then(t=>{ throw new Error('Drive API error '+r.status+': '+t); });
    return r.status===204 ? null : r.json();
  });
}
async function findOrCreateFolder(){
  const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await driveApi(`files?q=${q}&fields=files(id,name)`);
  if(res.files && res.files.length) return res.files[0].id;
  const created = await driveApi('files', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:DRIVE_FOLDER_NAME, mimeType:'application/vnd.google-apps.folder'})});
  return created.id;
}
async function findOrCreateFile(folderId){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and '${folderId}' in parents and trashed=false`);
  const res = await driveApi(`files?q=${q}&fields=files(id,name)`);
  if(res.files && res.files.length) return res.files[0].id;
  const created = await driveApi('files', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({name:DRIVE_FILE_NAME, parents:[folderId]})});
  return created.id;
}
async function driveDownload(fileId){
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {headers:{'Authorization':'Bearer '+gAccessToken}});
  if(!r.ok) return null;
  const text = await r.text();
  if(!text.trim()) return null;
  try{ return JSON.parse(text); }catch(e){ return null; }
}
async function driveUpload(fileId, data){
  await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method:'PATCH', headers:{'Authorization':'Bearer '+gAccessToken, 'Content-Type':'application/json'}, body: JSON.stringify(data)
  });
}
async function onDriveSignedIn(){
  const gate = document.getElementById('signinGate');

  try{
    const folderId = await findOrCreateFolder();
    gDriveFileId = await findOrCreateFile(folderId);
    const remote = await driveDownload(gDriveFileId);
    if(remote && remote.categories){
      const remoteTime = remote.lastModified||0, localTime = state.lastModified||0;
      if(remoteTime >= localTime){ state = remote; try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
    }
    gDriveReady = true;
    if(gate) gate.style.display = 'none';

  if(!gDriveReady || !gDriveFileId) return;

    try{ await driveUpload(gDriveFileId, state); driveStatus('synced just now'); }
    catch(e){ driveStatus('could not sync — check your connection'); }

/* Indian financial year: 1 Apr – 31 Mar. Returns the starting calendar year, e.g. 2026 for FY 2026-27. */
function financialYearStart(dateStr){
  const d = new Date(dateStr || todayISO());
  const y = d.getFullYear(), m = d.getMonth(); // 0-indexed; April = 3
  return m>=3 ? y : y-1;

/* Suggests the next invoice number in sequence for the FY the given date falls in, for the given series
   ('gst' = local invoices — GST and Cash share this one continuous sequence; 'cash' is kept only for
   reading old backup files that still have a separate cash sequence on file).
   Returns null if this would be the first invoice of that FY for that series (needs asking), or if the
   last invoice number on file has no trailing digits to increment. */
function suggestInvoiceNo(dateStr, series){
  const inv = state.invoiceSettings;
  const fy = financialYearStart(dateStr);
  const fyField = series==='cash' ? 'lastCashInvoiceFY' : 'lastInvoiceFY';
  const noField = series==='cash' ? 'lastCashInvoiceNo' : 'lastInvoiceNo';
  if(inv[fyField] !== fy || !inv[noField]) return null;
  const m = String(inv[noField]).match(/^(.*?)(\d+)(\D*)$/);

/* movement helpers */
function txByKind(kind){ return state.transactions.filter(t=>t.kind===kind); }
/* Payments ledger for sale/purchase invoices — supports part payments and discounts given at settlement time.
   Each entry: {id, date, amount, account, discount}. `amount` is cash actually moved into/from `account`;
   `discount` is written off with no cash movement. Legacy entries (created before this feature) have no
   .payments array and fall back to the old binary pending/settled behaviour via t.account. */
function paymentsTotal(t){ return (t.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0)+(Number(p.discount)||0), 0); }
function txOutstanding(t){
  if(!(t.kind==='sale'||t.kind==='purchase')) return 0;
  if(t.payments) return round2(txTotal(t) - paymentsTotal(t));
  const pendingName = t.kind==='sale' ? RECEIVABLE_ACCOUNT : PAYABLE_ACCOUNT;
  return t.account===pendingName ? round2(txTotal(t)) : 0;
}
function assetBalance(name){
  const acc = findAcc('asset', name); if(!acc) return 0;
  let bal = acc.opening;
  state.transactions.forEach(t=>{
    if(t.kind==='sale' && t.payments){
      (t.payments||[]).forEach(p=>{ if(p.account===name) bal += (Number(p.amount)||0); });
      if(name===RECEIVABLE_ACCOUNT){ const out=txOutstanding(t); if(out>0.004) bal+=out; }
      return;
    }
    if(t.kind==='purchase' && t.payments){
      (t.payments||[]).forEach(p=>{ if(p.account===name) bal -= (Number(p.amount)||0); });
      return;
    }
    if(t.kind==='contra'){
      if(t.fromAccount===name) bal -= (Number(t.amount)||0);
      if(t.toAccount===name) bal += (Number(t.amount)||0);
      return;
    }
    if(t.account !== name) return;
    const amt = txTotal(t);
    bal += (t.flow==='in' ? amt : -amt);

  return bal;

/* A liability account's balance is normally driven by purchase bills against it (Accounts Payable),
   but a Journal Entry Fund Transfer (contra) can also move it — e.g. a loan repayment out of Bank, or
   fresh loan proceeds received into Bank. A liability behaves OPPOSITE to an Asset/Equity account here:
   money sent TO a liability (e.g. "Transfer from Bank to UGRO Capital" = an EMI's principal) is paying
   it down, so it DECREASES the balance; money sourced FROM a liability (e.g. "Transfer from UGRO Capital
   to Bank" = taking a fresh loan) is new borrowing, so it INCREASES the balance. */
function liabilityBalance(name){
  const acc = findAcc('liability', name); if(!acc) return 0;
  let bal = acc.opening;
  state.transactions.forEach(t=>{
    if(t.kind==='contra'){
      if(t.fromAccount===name) bal += (Number(t.amount)||0);
      if(t.toAccount===name) bal -= (Number(t.amount)||0);
      return;
    }
    if(t.kind!=='purchase') return;
    if(t.payments){
      if(name===PAYABLE_ACCOUNT){ const out=txOutstanding(t); if(out>0.004) bal+=out; }
      return;
    }
    if(t.account!==name) return;
    bal += txTotal(t);
  });
  return bal;
}
/* Equity accounts (e.g. Owner's Capital) are normally a fixed opening balance you edit by hand in Settings,
   but a Fund Transfer (contra) can also move money into/out of one — e.g. reconciling an owner's drawing or
   a fresh capital injection found on a bank statement. Equity behaves OPPOSITE to an Asset here, the same
   way a Liability does: money sourced FROM the equity account (e.g. "Transfer from Owner's Capital to Bank"
   = a capital top-up) INCREASES it; money sent TO the equity account (e.g. "Transfer from Bank to Owner's
   Capital" = a drawing) DECREASES it — matching the field-note shown on the Journal Entry form. */
function equityBalance(name){
  const acc = findAcc('equity', name); if(!acc) return 0;
  let bal = acc.opening;
  state.transactions.forEach(t=>{
    if(t.kind!=='contra') return;
    if(t.fromAccount===name) bal += (Number(t.amount)||0);
    if(t.toAccount===name) bal -= (Number(t.amount)||0);
  });
  return bal;
}
function findItem(id){ return state.inventoryItems.find(i=>i.id==id); }
/* Two items are treated as the SAME item only when every distinguishing field matches (name compared
   case-insensitively). Qty on hand is deliberately excluded — it's a stock level, not a product
   parameter — so editing/adding qty never makes two items "different" or "the same" by itself.
   If the name matches but anything else here differs, it's a distinct item and both are kept. */
function itemFingerprint(f){
  return [
    (f.name||'').trim().toLowerCase(),
    (f.type||'').trim().toLowerCase(),
    (f.brand||'').trim().toLowerCase(),
    (f.color||'').trim().toLowerCase(),
    round2(f.gsm||0),
    (f.size||'').trim().toLowerCase(),
    (f.unit||'').trim().toLowerCase(),
    round2(f.cost),
    round2(f.price)
  ].join('||');
}
/* parties: clients (sales) / vendors (purchases) */
function partyListFor(kind){ return kind==='sale' ? state.clients : state.vendors; }
function findParty(kind, id){ return partyListFor(kind).find(p=>p.id==id); }
/* unify legacy single-item transactions and new multi-item transactions into one item list */
function txItems(t){
  if(t.items && t.items.length) return t.items;
  const item = t.itemId ? findItem(t.itemId) : null;
  const qty = t.itemId ? (t.qty||0) : null;
  return [{ itemId: t.itemId||null, name: item ? item.name : (t.category||'Item'), qty, rate: (item && qty) ? round2((Number(t.amount)||0)/qty) : null, amount: Number(t.amount)||0, gstRate: t.gstRate!=null?t.gstRate:18 }];
}
function itemValue(item){ return (Number(item.qty)||0) * (Number(item.cost)||0); }
/* Weighted-average costing: blends a new purchase's price into the item's existing stock so the
   item always carries one current cost = (total value on hand) ÷ (total qty on hand). */
function weightedAvgIn(item, qty, rate){
  qty = Number(qty)||0; const r = Number(rate); const effRate = isFinite(r) ? r : (Number(item.cost)||0);
  const oldQty = Number(item.qty)||0, oldCost = Number(item.cost)||0;
  const newQty = oldQty + qty;
  if(newQty > 0.0000001) item.cost = round2(((oldQty*oldCost) + (qty*effRate)) / newQty);
  item.qty = newQty;
}
function weightedAvgReverseIn(item, qty, rate){
  qty = Number(qty)||0; const effRate = Number(rate)||0;
  const oldQty = Number(item.qty)||0, oldCost = Number(item.cost)||0;
  const newQty = oldQty - qty;
  if(newQty > 0.0000001) item.cost = round2(((oldQty*oldCost) - (qty*effRate)) / newQty);
  item.qty = newQty;
}
/* Resize/compress a photo File to a small JPEG data URL before storing it in localStorage,
   so a couple of product photos per item don't blow past the browser's storage quota. */
function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w >= h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('Could not read image.'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('Could not read file.'));
    reader.readAsDataURL(file);
  });
}

let reportCustomFrom = '';
let reportCustomTo = '';
function periodStartDate(range){
  const now = new Date();
  if(range==='month') return new Date(now.getFullYear(), now.getMonth(), 1).toISOString().slice(0,10);
  if(range==='year') return new Date(now.getFullYear(), 0, 1).toISOString().slice(0,10);
  if(range==='quarter'){ const q = Math.floor(now.getMonth()/3); return new Date(now.getFullYear(), q*3, 1).toISOString().slice(0,10); }
  if(range==='half'){ const h = now.getMonth()<6?0:1; return new Date(now.getFullYear(), h*6, 1).toISOString().slice(0,10); }
  if(range==='custom') return reportCustomFrom || '0001-01-01';
  return '0001-01-01'; // all
}
function periodEndDate(range){
  if(range==='custom' && reportCustomTo) return reportCustomTo;
  return todayISO();
}
function rangeLabel(range){
  if(range==='month') return 'This month';
  if(range==='year') return 'This year';
  if(range==='quarter') return 'This quarter';
  if(range==='half') return 'This half-year';
  if(range==='custom') return (reportCustomFrom||reportCustomTo) ? `${reportCustomFrom?dispDate(reportCustomFrom):'Start'} – ${reportCustomTo?dispDate(reportCustomTo):'Today'}` : 'Custom period';
  return 'All time';
}
function periodFilter(range){
  const now = new Date();
  return (dateStr)=>{
    const d = new Date(dateStr);
    if(range==='month') return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
    if(range==='year') return d.getFullYear()===now.getFullYear();
    if(range==='quarter') return dateStr >= periodStartDate('quarter') && dateStr <= periodEndDate('quarter');
    if(range==='half') return dateStr >= periodStartDate('half') && dateStr <= periodEndDate('half');
    if(range==='custom') return dateStr >= periodStartDate('custom') && dateStr <= periodEndDate('custom');
    return true; // all
  };
}
function isToday(dateStr){ return dateStr===todayISO(); }
function isSameMonth(dateStr){ const d=new Date(dateStr), n=new Date(); return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth(); }

function totalIncome(range){
  const f = periodFilter(range);
  return state.transactions.filter(t=> (t.kind==='sale'||t.kind==='income') && f(t.date)).reduce((s,t)=>s+t.amount,0);
}
/* totalExpense() must be accrual-correct — Cost of Goods Sold (not raw purchases), adjusted for
   opening/closing stock, same math as the Trading Account — plus Other Expenses. It must NOT simply sum
   every purchase, because that treats every rupee spent on inventory as an expense the instant it's
   purchased, even the portion still sitting on the shelf unsold. That version silently breaks the
   fundamental accounting equation (Assets = Liabilities + Equity) for any business carrying stock, since
   the unsold portion stays correctly on the Balance Sheet as an Asset while ALSO being wrongly subtracted
   here — the same rupees hit twice. This also feeds netProfit() below (Retained Earnings on the Balance
   Sheet, and the Dashboard's Net Profit card), so it has to agree with the Trading Account / P&L, or a
   business with any inventory on hand would see different "profit" figures across the app and a Balance
   Sheet that doesn't balance. */
function totalExpense(range){
  const opening = openingStockValue(range);
  const purchases = purchasesTotal(range);
  const closing = closingStockValue();
  const cogs = opening + purchases - closing;
  const f = periodFilter(range);
  const otherExpense = state.transactions.filter(t=>t.kind==='expense' && f(t.date)).reduce((s,t)=>s+t.amount,0);
  return cogs + otherExpense;
}
function netProfit(range){ return totalIncome(range) - totalExpense(range); }
function salesTotal(range){ const f=periodFilter(range); return state.transactions.filter(t=>t.kind==='sale' && f(t.date)).reduce((s,t)=>s+t.amount,0); }
function purchasesTotal(range){ const f=periodFilter(range); return state.transactions.filter(t=>t.kind==='purchase' && f(t.date)).reduce((s,t)=>s+t.amount,0); }
/* Reconstructs total inventory value as it stood at the START of a period, by starting from the
   CURRENT qty/cost of every item and reversing every stock movement dated on/after that start date,
   most-recent-first — the same weighted-average math used forward, run backward. Movements that
   predate this costing feature (or sales-return "in" movements, which intentionally carry no rate)
   only have their quantity reversed, since no cost was recorded for them; this is a reasonable
   approximation, not a perfect historical ledger. */
function openingStockValue(range){
  const startDate = periodStartDate(range);
  const snap = {};
  state.inventoryItems.forEach(i=>{ snap[i.id] = {qty:Number(i.qty)||0, cost:Number(i.cost)||0}; });
  [...state.inventoryMovements].reverse().filter(m=>m.date>=startDate).forEach(m=>{
    const s = snap[m.itemId]; if(!s) return;
    if(m.type==='in'){
      if(m.rate!=null) weightedAvgReverseIn(s, m.qty, m.rate);
      else s.qty -= (Number(m.qty)||0);
    }
    else if(m.type==='out') s.qty += (Number(m.qty)||0);
    else s.qty -= (Number(m.qty)||0);
  });
  return Object.values(snap).reduce((sum,s)=> sum + Math.max(s.qty,0)*s.cost, 0);
}
function closingStockValue(){ return inventoryValue(); }

function outputGST(range){
  const f = periodFilter(range);
  return state.transactions.filter(t=>t.kind==='sale' && f(t.date))
    .reduce((s,t)=>({cgst:s.cgst+(t.cgst||0), sgst:s.sgst+(t.sgst||0), igst:s.igst+(t.igst||0)}), {cgst:0,sgst:0,igst:0});
}
function inputGST(range){
  const f = periodFilter(range);
  return state.transactions.filter(t=>t.kind==='purchase' && f(t.date))
    .reduce((s,t)=>({cgst:s.cgst+(t.cgst||0), sgst:s.sgst+(t.sgst||0), igst:s.igst+(t.igst||0)}), {cgst:0,sgst:0,igst:0});
}
function gstTotal(o){ return o.cgst+o.sgst+o.igst; }
function netGSTPayable(range){ return gstTotal(outputGST(range)) - gstTotal(inputGST(range)); }

/* ============================= INVOICE (PDF-ready, printable) ============================= */
function numToWordsIndian(num){
  num = Math.round(Number(num)||0);
  if(num===0) return 'Zero';
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigits(n){
    if(n<20) return ones[n];
    return tens[Math.floor(n/10)] + (n%10 ? ' '+ones[n%10] : '');
  }
  function threeDigits(n){
    let s='';
    if(n>=100){ s += ones[Math.floor(n/100)]+' Hundred'; n%=100; if(n) s+=' '; }
    if(n) s += twoDigits(n);
    return s;
  }
  const crore = Math.floor(num/10000000); num%=10000000;
  const lakh = Math.floor(num/100000); num%=100000;
  const thousand = Math.floor(num/1000); num%=1000;
  const hundred = num;
  let parts = [];
  if(crore) parts.push(threeDigits(crore)+' Crore');
  if(lakh) parts.push(threeDigits(lakh)+' Lakh');
  if(thousand) parts.push(threeDigits(thousand)+' Thousand');
  if(hundred) parts.push(threeDigits(hundred));
  return parts.join(' ');
}

/* Renders the business name in two tones: navy up to (and not including) "Commercial", rose-gold from
   "Commercial" onward — matches the approved invoice branding. Falls back to solid navy if the saved
   business name doesn't contain "Commercial" (e.g. it gets renamed later in Settings). */
function brandNameHtml(name){
  name = name || '';
  const idx = name.indexOf('Commercial');
  if(idx===-1) return `<span style="color:#162660;">${name}</span>`;
  const first = name.slice(0, idx).trim();
  const rest = name.slice(idx);
  return `<span style="color:#162660;">${first}</span> <span style="color:#a8794f;">${rest}</span>`;
}

  const isReturnDoc = t.docType==='credit-note' || t.docType==='debit-note';

          <tr style="border-top:2px solid #162660;font-weight:700;"><td colspan="5" style="text-align:right;padding:7px 6px;">${t.docType==='credit-note' ? 'TOTAL CREDIT' : t.docType==='debit-note' ? 'TOTAL DEBIT' : 'TOTAL'}</td><td style="text-align:right;padding:7px 6px;font-size:20px;color:#162660;">${money(grand)}</td></tr>

      <table style="width:100%;margin-top:26px;font-size:15px;">
        <tr>

  const SINGLE_PAGE_MAX = 14; // empirically tested with typical one-line item descriptions
  const pagesHtml = lines.length <= SINGLE_PAGE_MAX
    ? `<div class="inv-sheet inv-sheet--col">

  const html = `
    <div class="inv-actions">
      <button class="btn ghost" id="invCloseBtn">✕ Close</button>
      <button class="btn primary" id="invPrintBtn">🖨 Print / Save as PDF</button>
    </div>

  `;
  let modal = document.getElementById('invoiceModal');
  if(!modal){ modal = document.createElement('div'); modal.id='invoiceModal'; modal.className='inv-modal'; document.body.appendChild(modal); }

  document.getElementById('invCloseBtn').addEventListener('click', ()=>{ modal.style.display='none'; });

}

/* ============================= MARK SALE/PURCHASE AS SETTLED (choose Cash / Bank) ============================= */
function openMarkSettledModal(txId){
  const t = state.transactions.find(x=>x.id==txId);
  if(!t) return;
  const isSale = t.kind==='sale';
  const accounts = cashBankAccounts();
  if(!accounts.length){ toast('Add a Cash or Bank account first, under Settings.'); return; }
  if(!t.payments) t.payments = [];
  const outstanding = txOutstanding(t);
  let modal = document.getElementById('partyModal');
  if(!modal){ modal = document.createElement('div'); modal.id='partyModal'; modal.className='party-modal'; document.body.appendChild(modal); }
  const paidSoFar = paymentsTotal(t);
  const paymentsListHtml = !t.payments.length ? '' : `
        <div style="display:grid; gap:6px;">
          <label style="margin-bottom:0;">Recorded payments — edit or remove below</label>
          ${t.payments.map(p=>`
          <div class="row" data-payrow="${p.id}" style="gap:6px; align-items:center; border:1px solid var(--rule); border-radius:7px; padding:7px 8px;">
            <input type="date" class="payDate" data-id="${p.id}" value="${p.date||''}" style="flex:1.1; min-width:120px;">
            <input type="number" step="any" class="payAmount" data-id="${p.id}" value="${p.amount||0}" style="flex:1; min-width:80px;" placeholder="Amount">
            <select class="payAccount" data-id="${p.id}" style="flex:1.2; min-width:110px;">${accounts.map(a=>`<option value="${a.name}" ${a.name===p.account?'selected':''}>${a.name}</option>`).join('')}</select>
            <input type="number" step="any" class="payDiscount" data-id="${p.id}" value="${p.discount||0}" style="flex:1; min-width:80px;" placeholder="Discount">
            <button class="btn ghost small" data-rmpay="${p.id}" title="Remove this payment">🗑</button>
          </div>`).join('')}
        </div>`;
  modal.innerHTML = `
    <div class="party-card">
      <h3>${isSale?'Payments received':'Payments made'}</h3>
      <div style="display:grid; gap:10px;">
        <div class="field-note" style="margin:0;">${t.description||(isSale?'This sale':'This purchase')} · Total ${money(txTotal(t))}${paidSoFar>0.004?` · Recorded so far ${money(paidSoFar)}`:''} · Outstanding ${money(outstanding)}</div>
        ${paymentsListHtml}
        ${outstanding>0.004 ? `
        <div class="disp" style="font-size:13px; margin-top:2px;">Record ${t.payments.length ? 'another' : 'a'} payment</div>
        <div><label>Date ${isSale?'received':'paid'}</label><input id="mrDate" type="date" value="${todayISO()}"></div>
        <div><label>Amount</label><input id="mrAmount" type="number" step="any" min="0" value="${outstanding}"></div>
        <div><label>${isSale?'Received into':'Paid from'}</label>
          <select id="mrAccount">${accounts.map(a=>`<option value="${a.name}">${a.name}</option>`).join('')}</select>
        </div>
        <div><label>Discount given now (optional, ${state.currency})</label><input id="mrDiscount" type="number" step="any" min="0" value="0"></div>
        <div class="field-note" id="mrPreview" style="margin:0;"></div>` : `<div class="field-note" style="margin:0;">This entry is fully settled. You can still edit the date, amount, account, or discount on the payments above, or remove one.</div>`}
      </div>
      <div class="row">
        <button class="btn ghost" id="mrCancel">Close</button>
        ${outstanding>0.004 ? `<button class="btn primary" id="mrSave">Save</button>` : ''}
      </div>
    </div>
  `;
  modal.style.display = 'flex';

  modal.querySelectorAll('[data-payrow]').forEach(rowEl=>{
    const id = rowEl.dataset.payrow;
    rowEl.querySelector('.payDate').addEventListener('change', e=>{
      const p = t.payments.find(x=>x.id==id); if(!p) return;
      p.date = e.target.value; save();
    });
    rowEl.querySelector('.payAmount').addEventListener('change', e=>{
      const p = t.payments.find(x=>x.id==id); if(!p) return;
      p.amount = round2(parseFloat(e.target.value)||0); save(); render(); openMarkSettledModal(txId);
    });
    rowEl.querySelector('.payAccount').addEventListener('change', e=>{
      const p = t.payments.find(x=>x.id==id); if(!p) return;
      p.account = e.target.value; save();
    });
    rowEl.querySelector('.payDiscount').addEventListener('change', e=>{
      const p = t.payments.find(x=>x.id==id); if(!p) return;
      p.discount = round2(parseFloat(e.target.value)||0); save(); render(); openMarkSettledModal(txId);
    });
  });
  modal.querySelectorAll('[data-rmpay]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(!confirm('Remove this payment record?')) return;
      t.payments = t.payments.filter(p=>p.id!=btn.dataset.rmpay);
      save(); toast('Payment removed.'); render(); openMarkSettledModal(txId);
    });
  });

  const discInp = document.getElementById('mrDiscount');
  const amountInp = document.getElementById('mrAmount');
  const preview = document.getElementById('mrPreview');
  function updatePreview(){
    if(!amountInp) return;
    const amt = round2(parseFloat(amountInp.value)||0);
    const disc = round2(parseFloat(discInp.value)||0);
    const remaining = round2(outstanding - amt - disc);
    if(remaining > 0.004) preview.textContent = `Part payment — ${money(remaining)} will still be pending after this.`;
    else if(remaining < -0.004) preview.textContent = `That's more than the outstanding balance — reduce the amount or discount.`;
    else preview.textContent = `This will fully settle the ${isSale?'invoice':'bill'}.`;
  }
  if(amountInp){ updatePreview(); amountInp.addEventListener('input', updatePreview); discInp.addEventListener('input', updatePreview); }

  document.getElementById('mrCancel').addEventListener('click', ()=>{ modal.style.display='none'; });
  modal.addEventListener('click', e=>{ if(e.target===modal) modal.style.display='none'; });
  const saveBtn = document.getElementById('mrSave');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    const amt = round2(parseFloat(amountInp.value)||0);
    const disc = round2(parseFloat(discInp.value)||0);
    const payDate = document.getElementById('mrDate').value || todayISO();
    const account = document.getElementById('mrAccount').value;
    if(amt<=0 && disc<=0){ toast('Enter an amount received/paid or a discount.'); return; }
    if(amt>0 && !account){ toast('Choose an account.'); return; }
    if(round2(amt+disc-outstanding) > 0.004){ toast('Amount entered adds up to more than the outstanding balance.'); return; }
    if(amt>0) t.payments.push({ id: uid(), date: payDate, amount: amt, account, discount: 0 });
    if(disc>0) t.payments.push({ id: uid(), date: payDate, amount: 0, account: null, discount: disc });
    const newOutstanding = txOutstanding(t);
    if(newOutstanding<=0.004 && amt>0) t.account = account;
    save(); modal.style.display='none';
    toast(newOutstanding<=0.004 ? `Marked ${isSale?'received':'paid'} in full.` : `Part payment recorded — ${money(newOutstanding)} still pending.`);
    render();
  });
}

/* ============================= SALES RETURN / PURCHASE RETURN (credit note / debit note) =============================
   Reverses part or all of a sale or purchase: customer/vendor, GST, and state are carried over from the
   original invoice/bill, quantities entered here are what's being returned. On save it adjusts stock
   (returned sales stock goes back in at no change to cost; returned purchase stock goes back out, also
   at no change to cost — the units were part of the existing costed batch either way), reduces recorded
   Sales/Purchases and Output/Input GST for the period (stored as negative amounts so they net out
   correctly wherever sales/purchases are totalled, including the Trading Account), and is numbered
   manually since there's no fixed numbering scheme for credit/debit notes.
   Whether the original invoice/bill still has anything outstanding decides what happens to its pending
   status — same rule for every channel (Local GST/Cash or Marketplace):
     - Still outstanding (nothing/partly received or paid): the return is applied as a write-off against
       what's left outstanding, capped so it can never go negative — so a full return on a still-pending
       invoice closes it (nothing left to collect), and a partial return reduces the pending amount.
     - Already fully settled: the return does NOT touch payments or create a refund entry — no cash
       actually moved in the books, so nothing here would be accurate. If money was genuinely refunded,
       record that separately with a Journal Entry. */
function openReturnModal(txId, kind){
  const orig = state.transactions.find(x=>x.id==txId);
  if(!orig){ toast('Original entry no longer exists.'); return; }
  const origLines = txItems(orig);
  if(!origLines.length){ toast('This entry has no item lines to return.'); return; }
  const isSale = kind==='sale';
  const noun = isSale ? 'Sales return' : 'Purchase return';
  const docType = isSale ? 'credit-note' : 'debit-note';
  const categoryConst = isSale ? CREDIT_NOTE_CATEGORY : PURCHASE_RETURN_CATEGORY;
  const outstandingBefore = txOutstanding(orig);
  let modal = document.getElementById('partyModal');
  if(!modal){ modal = document.createElement('div'); modal.id='partyModal'; modal.className='party-modal'; document.body.appendChild(modal); }

  modal.innerHTML = `
    <div class="party-card wide">
      <h3>${noun} against ${orig.invoiceNo||'—'}</h3>
      <div class="field-note" style="margin:0 0 14px;">${orig.description||'—'} · Original total ${money(txTotal(orig))}</div>
      <div class="im-grid">
        <div><label>Date</label><input id="cnDate" type="date" value="${todayISO()}"></div>
        <div class="span2"><label>${noun} / reference number</label><input id="cnNo" placeholder="e.g. your own return/credit-note or debit-note reference"></div>
      </div>
      <table class="line-tbl" style="margin-top:10px;">
        <thead><tr><th>Item</th><th class="num">${isSale?'Sold':'Purchased'} qty</th><th class="num">Rate</th><th class="num">Qty returned</th><th class="num">${isSale?'Credit':'Debit'} amount</th></tr></thead>
        <tbody id="cnLines">${origLines.map((l,idx)=>`
          <tr data-cnline="${idx}">
            <td>${l.name||'—'}</td>
            <td class="num muted">${fmt(l.qty)}</td>
            <td class="num muted">${money(l.rate)}</td>
            <td class="num"><input class="cnQty" type="number" step="any" min="0" max="${Math.abs(l.qty)}" value="0" style="width:90px;"></td>
            <td class="num cnLineAmt muted">${money(0)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div class="field-note" id="cnPreview" style="margin-top:10px;"></div>
      <div class="field-note">If you've already returned part of this ${isSale?'invoice':'bill'} before, keep that in mind — this doesn't track prior returns against the same entry, so it's on you to avoid returning more than was actually sent back.</div>
      <div class="row">
        <button class="btn ghost" id="cnCancel">Cancel</button>
        <button class="btn primary" id="cnSave">Save ${noun.toLowerCase()}</button>
      </div>
    </div>
  `;
  modal.style.display = 'flex';

  const dateInp = document.getElementById('cnDate');
  const noInp = document.getElementById('cnNo');
  const preview = document.getElementById('cnPreview');
  const qtyInputs = [...document.querySelectorAll('.cnQty')];

  function currentReturns(){
    return qtyInputs.map((inp,idx)=>{
      const l = origLines[idx];
      const maxQty = Math.abs(Number(l.qty)||0);
      let q = parseFloat(inp.value)||0;
      if(q<0) q=0;
      if(q>maxQty) q=maxQty;
      const amt = round2(q * (Number(l.rate)||0));
      return { itemId: l.itemId||null, name: l.name||'', rate: Number(l.rate)||0, gstRate: l.gstRate!=null?l.gstRate:(orig.gstRate||0), qty: q, amount: amt };
    });
  }
  function updatePreview(){
    const returns = currentReturns();
    qtyInputs.forEach((inp,idx)=>{
      const row = inp.closest('tr');
      row.querySelector('.cnLineAmt').textContent = money(returns[idx].amount);
    });
    const taxable = round2(returns.reduce((s,l)=>s+l.amount,0));
    const rateGroups = {};
    returns.forEach(l=>{ if(l.amount>0) rateGroups[l.gstRate] = (rateGroups[l.gstRate]||0)+l.amount; });
    let cgst=0,sgst=0,igst=0;
    Object.keys(rateGroups).forEach(r=>{ const g = computeGST(rateGroups[r], parseFloat(r), orig.supplyType); cgst+=g.cgst; sgst+=g.sgst; igst+=g.igst; });
    cgst=round2(cgst); sgst=round2(sgst); igst=round2(igst);
    const total = round2(taxable+cgst+sgst+igst);
    if(taxable<=0) preview.textContent = 'Enter a returned quantity on at least one line.';
    else if(outstandingBefore>0.004){
      const applyAmt = Math.min(total, outstandingBefore);
      preview.innerHTML = `${isSale?'Credit':'Debit'} taxable value ${money(taxable)} + GST ${money(cgst+sgst+igst)} = <b>${money(total)}</b> will reduce this period's ${isSale?'sales':'purchases'} and ${isSale?'Output':'Input'} GST, and reduce what's ${isSale?'still owed to you':'still owed by you'} on the original ${isSale?'invoice':'bill'} by ${money(applyAmt)}${applyAmt<total?` (capped — only ${money(applyAmt)} was still outstanding)`:''}.`;
    } else {
      preview.innerHTML = `${isSale?'Credit':'Debit'} taxable value ${money(taxable)} + GST ${money(cgst+sgst+igst)} = <b>${money(total)}</b> will reduce this period's ${isSale?'sales':'purchases'} and ${isSale?'Output':'Input'} GST. This ${isSale?'invoice':'bill'} is already fully settled, so no refund entry will be created — record any actual money refunded separately with a Journal Entry.`;
    }
  }
  qtyInputs.forEach(inp=>inp.addEventListener('input', updatePreview));
  updatePreview();

  document.getElementById('cnCancel').addEventListener('click', ()=>{ modal.style.display='none'; });
  modal.addEventListener('click', e=>{ if(e.target===modal) modal.style.display='none'; });
  document.getElementById('cnSave').addEventListener('click', ()=>{
    const date = dateInp.value || todayISO();
    const refNo = noInp.value.trim();
    if(!refNo){ toast(`Enter the ${noun.toLowerCase()} / reference number.`); return; }
    const returns = currentReturns().filter(l=>l.qty>0);
    if(!returns.length){ toast('Enter a returned quantity on at least one line.'); return; }

    const items = returns.map(l=>({ itemId:l.itemId, name:l.name, qty:-l.qty, rate:l.rate, gstRate:l.gstRate, amount:round2(-l.amount) }));
    const amount = round2(items.reduce((s,l)=>s+l.amount,0));
    const rateGroups = {};
    items.forEach(l=>{ rateGroups[l.gstRate] = (rateGroups[l.gstRate]||0)+l.amount; });
    let cgst=0,sgst=0,igst=0;
    Object.keys(rateGroups).forEach(r=>{ const g = computeGST(rateGroups[r], parseFloat(r), orig.supplyType); cgst+=g.cgst; sgst+=g.sgst; igst+=g.igst; });
    cgst=round2(cgst); sgst=round2(sgst); igst=round2(igst);

    const id = uid();
    items.forEach(l=>{
      if(!l.itemId) return;
      const item = findItem(l.itemId);
      if(!item) return;
      const returnedQty = Math.abs(l.qty);
      if(isSale){
        item.qty += returnedQty; // returned sales stock goes back in, at no change to cost
        state.inventoryMovements.push({ id: uid(), date, itemId: item.id, type:'in', qty: returnedQty, note: `Auto: Sales return ${refNo} (against ${orig.invoiceNo||''})`.trim(), txId: id });
      } else {
        if(item.qty - returnedQty < 0 && !confirm(`This will take "${item.name}" below zero stock. Continue?`)) return;
        item.qty -= returnedQty; // returned purchase stock goes back out, at no change to cost
        state.inventoryMovements.push({ id: uid(), date, itemId: item.id, type:'out', qty: returnedQty, note: `Auto: Purchase return ${refNo} (against ${orig.invoiceNo||''})`.trim(), txId: id });
      }
    });

    state.transactions.push({
      id, date, kind, docType, category: categoryConst, amount,
      account: null, description: orig.description||'', flow: isSale?'out':'in',
      invoiceNo: refNo, gstin: orig.gstin||'',
      partyId: orig.partyId||null, buyerState: orig.buyerState||'',
      saleChannel: orig.saleChannel||'local-gst', supplyType: orig.supplyType,
      items, cgst, sgst, igst, gstRate: Object.keys(rateGroups).length===1 ? parseFloat(Object.keys(rateGroups)[0]) : null,
      refTxId: orig.id, refInvoiceNo: orig.invoiceNo||''
    });

    // Write off against what's still outstanding on the original invoice/bill — for every channel,
    // capped so it can never push the balance negative. If it was already fully settled, outstandingBefore
    // is 0, so nothing is pushed here at all (Option B — no auto-refund entry; journal it manually if needed).
    const grossReturn = Math.abs(round2(amount+cgst+sgst+igst));
    const applyAmt = Math.min(grossReturn, outstandingBefore);
    if(applyAmt>0.004){
      if(!orig.payments) orig.payments = [];
      orig.payments.push({ id: uid(), date, amount: 0, account: null, discount: applyAmt, note: `${noun} ${refNo}` });
    }

    save(); modal.style.display='none';
    toast(`${noun} saved — ${money(grossReturn)} reversed${applyAmt>0.004 ? ` (${money(applyAmt)} written off the ${isSale?'receivable':'payable'})` : (outstandingBefore<=0.004 ? ' (already settled — no refund entry created)' : '')}.`);
    render();
  });
}
function openCreditNoteModal(txId){ openReturnModal(txId, 'sale'); }
function openPurchaseReturnModal(txId){ openReturnModal(txId, 'purchase'); }

        <div><label>Unit price (${state.currency})</label><input id="imCost" type="number" step="any" min="0" value="${item.cost}"></div>
        <div><label>Sale price (${state.currency})</label><input id="imPrice" type="number" step="any" min="0" value="${item.price||0}"></div>
        <div class="span2">
          <label>Photos (up to 2)</label>
          <div id="imPhotoList" style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:8px;">${photosHtml()}</div>
          <input type="file" id="imPhotoInput" accept="image/*" multiple>

      </div>

    if(remaining<=0){ toast('Maximum 2 photos per item — remove one first.'); e.target.value=''; return; }
    const files = [...e.target.files].slice(0, remaining);
    if(!files.length) return;
    try{
      const newPhotos = await Promise.all(files.map(file=>resizeImageFile(file, 480, 0.6)));
      workingPhotos.push(...newPhotos);
      document.getElementById('imPhotoList').innerHTML = photosHtml();
      wirePhotoRemoveButtons();
    }catch(err){ toast('Could not process one of the photos.'); }
    e.target.value = '';
  });

  document.getElementById('imCancel').addEventListener('click', ()=>{ modal.style.display='none'; });
  modal.addEventListener('click', e=>{ if(e.target===modal) modal.style.display='none'; });
  document.getElementById('imSave').addEventListener('click', ()=>{
    const name = document.getElementById('imName').value.trim();
    if(!name){ toast('Enter an item name.'); return; }
    const candidate = {
      name, type: document.getElementById('imType').value.trim(),
      brand: document.getElementById('imBrand').value.trim(),
      color: document.getElementById('imColor').value.trim(),
      gsm: parseFloat(document.getElementById('imGsm').value)||0,
      size: document.getElementById('imSize').value.trim(),
      unit: document.getElementById('imUnit').value.trim()||'pcs',
      cost: parseFloat(document.getElementById('imCost').value)||0,
      price: parseFloat(document.getElementById('imPrice').value)||0
    };
    if(state.inventoryItems.some(i=>i.id!=item.id && itemFingerprint(i)===itemFingerprint(candidate))){ toast('Another item already has that exact same name and details.'); return; }
    Object.assign(item, candidate);
    item.qty = parseFloat(document.getElementById('imQty').value)||0;
    item.photos = workingPhotos;
    save(); modal.style.display='none'; toast('Item updated.'); render();
  });
}

let activeTab='dashboard';

});
function goTab(tab){ activeTab=tab; editingTxId=null; editingItemId=null; [...nav.querySelectorAll('button')].forEach(b=>b.classList.toggle('active', b.dataset.tab===tab)); render(); }

function render(){
  document.getElementById('bizName').textContent = state.businessName;

}

      <div class="card"><div class="label">Today · In / Out</div><div class="value num">${money(todayIn)} <span class="muted" style="font-size:15px;">/ ${money(todayOut)}</span></div><div class="foot">${todayTx.length} entries logged today</div></div>
      <div class="card ${cashInHandBal<0?'bad':''}"><div class="label">Cash In Hand</div><div class="value num">${money(cashInHandBal)}</div><div class="foot">Excludes pending receivables</div></div>

function deleteTransaction(id){
  const t = state.transactions.find(x=>x.id==id);
  if(!t) return;
  // reverse any linked inventory effect (multi-item aware, with legacy single-item fallback)
  const lines = (t.items && t.items.length) ? t.items : (t.itemId ? [{itemId:t.itemId, qty:t.qty, rate: t.amount && t.qty ? t.amount/t.qty : 0}] : []);
  lines.forEach(line=>{
    if(!line.itemId) return;
    const item = findItem(line.itemId);
    if(!item) return;
    if(t.kind==='sale') item.qty += Number(line.qty)||0;
    else if(t.kind==='purchase'){
      // Debit notes (purchase returns) never touched cost when created — just qty — so undo the same way.
      if(t.docType==='debit-note') item.qty -= Number(line.qty)||0;
      else weightedAvgReverseIn(item, line.qty, line.rate);
    }
  });
  if(lines.length) state.inventoryMovements = state.inventoryMovements.filter(m=>m.txId!=t.id);
  state.transactions = state.transactions.filter(x=>x.id!=id);
  save(); toast('Entry deleted.');
}

            <optgroup label="Equity">${state.accounts.equity.map(a=>`<option value="${a.name}">${a.name}</option>`).join('')}</optgroup>
            <optgroup label="Income titles">${state.categories.income.map(c=>`<option value="${c}">${c}</option>`).join('')}</optgroup>
            <optgroup label="Expense titles">${state.categories.expense.map(c=>`<option value="${c}">${c}</option>`).join('')}</optgroup>

          <select name="toAccount">
            <optgroup label="Assets">${state.accounts.asset.map(a=>`<option value="${a.name}">${a.name}</option>`).join('')}</optgroup>
            <optgroup label="Liabilities">${state.accounts.liability.map(a=>`<option value="${a.name}">${a.name}</option>`).join('')}</optgroup>
            <optgroup label="Equity">${state.accounts.equity.map(a=>`<option value="${a.name}">${a.name}</option>`).join('')}</optgroup>
            <optgroup label="Income titles">${state.categories.income.map(c=>`<option value="${c}">${c}</option>`).join('')}</optgroup>
            <optgroup label="Expense titles">${state.categories.expense.map(c=>`<option value="${c}">${c}</option>`).join('')}</optgroup>
          </select>

        <div class="field-note">Tip: a transfer from Bank/Cash to Owner's Capital records a drawing; from Owner's Capital to Bank/Cash records a capital top-up. For a loan (Liability account), it's the opposite way round: a transfer from Bank/Cash to the loan account records an EMI's principal / a repayment — the loan balance goes down; from the loan account to Bank/Cash records fresh loan proceeds received — the loan balance goes up. You can also pick an Income title as "Transfer from" (records it as income into the Asset account on the other side) or an Expense title as "Transfer to" (records it as an expense paid from the Asset account on the other side) — those are logged as a normal Income/Expense entry, not a transfer. Liability and Equity accounts can only be used for a plain transfer, paired with another real account.</div>

      <table>
        <thead><tr><th>Date</th><th>Type</th><th>Title</th><th>Description</th><th>Account</th><th class="num">Amount</th><th></th></tr></thead>
        <tbody>${rows.length ? rows.map(t=>{

  const toAcctField = document.getElementById('toAcctField');

  function refreshFields(){
    const k = kindSelect.value;
    if(k==='contra'){
      catField.style.display='none';
      singleAcctField.style.display='none';
      fromAcctField.style.display='';
      toAcctField.style.display='';

      catField.style.display='';
      singleAcctField.style.display='';
      fromAcctField.style.display='none';
      toAcctField.style.display='none';
      const cats = state.categories[k];
      catSelect.innerHTML = cats.map(c=>`<option value="${c}">${c}</option>`).join('') + `<option value="__new__">＋ Add new title…</option>`;

    const amount = parseFloat(f.get('amount'));
    if(!amount || amount<=0){ toast('Enter a valid amount.'); return; }
    const kind = f.get('kind');

    if(kind==='contra'){
      const fromAccount = f.get('fromAccount');
      const toAccount = f.get('toAccount');
      if(!fromAccount || !toAccount){ toast('Choose both accounts.'); return; }
      if(fromAccount===toAccount){ toast('Transfer from and Transfer to must be different accounts.'); return; }

      const isAssetAccount = (name)=> state.accounts.asset.some(a=>a.name===name);
      const isIncomeCat = (name)=> state.categories.income.includes(name);
      const isExpenseCat = (name)=> state.categories.expense.includes(name);
      // Contra (Fund Transfer) is strictly between real ledger accounts — Asset, Liability, or Equity —
      // never a category. Picking an Income title as "from" or an Expense title as "to" isn't a transfer
      // at all — it's really an Income/Expense entry, so it's routed and saved as one instead, same as if

      // with a real Asset account (Cash/Bank/etc.) on the other side, since that's the only side where

      let routed = null;
      if(isRealAccount(fromAccount) && isRealAccount(toAccount)){
        routed = null;
      } else if(isIncomeCat(fromAccount) && isAssetAccount(toAccount)){
        routed = { kind:'income', category: fromAccount, account: toAccount, flow:'in' };

        routed = { kind:'expense', category: toAccount, account: fromAccount, flow:'out' };

        toast('Pick a real Asset account (Cash/Bank/etc.) on one side when using an Income or Expense title. For a plain transfer, pick a real account (Asset/Liability/Equity) on both sides.');
        return;

      if(editingId){
        const t = state.transactions.find(x=>x.id==editingId);

          if(routed){
            t.kind=routed.kind; t.date=f.get('date')||todayISO(); t.category=routed.category; t.account=routed.account; t.amount=amount; t.description=f.get('description')||''; t.flow=routed.flow;
            delete t.fromAccount; delete t.toAccount;
          } else {
            t.kind='contra'; t.date=f.get('date')||todayISO(); t.fromAccount=fromAccount; t.toAccount=toAccount; t.amount=amount; t.description=f.get('description')||'';
            delete t.category; delete t.account; delete t.flow;
          }
        }
        save(); toast('Entry updated.'); editingId=null; render();
        return;
      }
      if(routed){
        state.transactions.push({ id: uid(), date: f.get('date')||todayISO(), kind: routed.kind, category: routed.category, amount, account: routed.account, description: f.get('description')||'', flow: routed.flow });
        save(); toast(`${routed.kind==='income'?'Income':'Expense'} entry saved — ${money(amount)} (${routed.category}).`);
        render();
        return;
      }
      state.transactions.push({
        id: uid(), date: f.get('date')||todayISO(), kind:'contra', fromAccount, toAccount, amount,
        description: f.get('description')||''
      });
      save(); toast(`Transferred ${money(amount)} from ${fromAccount} to ${toAccount}.`);
      render();
      return;
    }

    const flow = kind==='income' ? 'in' : 'out';
    const cats = state.categories[kind];
    const category = f.get('category')==='__new__' ? cats[0] : f.get('category');
    if(!category){ toast('Choose a title/category.'); return; }
    if(editingId){
      const t = state.transactions.find(x=>x.id==editingId);
      if(t){ t.kind=kind; t.date=f.get('date')||todayISO(); t.category=category; t.amount=amount; t.account=f.get('account'); t.description=f.get('description')||''; t.flow=flow; delete t.fromAccount; delete t.toAccount; }
      save(); toast('Entry updated.'); editingId=null; render();
      return;
    }
    state.transactions.push({
      id: uid(), date: f.get('date')||todayISO(), kind, category, amount,
      account: f.get('account'), description: f.get('description')||'', flow
    });
    save(); toast(`${kind==='income'?'Income':'Expense'} entry saved — ${money(amount)}`);
    render();
  });

  function startEdit(txId){
    const t = state.transactions.find(x=>x.id==txId);
    if(!t) return;
    editingId = t.id;
    kindSelect.value = t.kind;
    refreshFields();
    const form = document.getElementById('txForm');
    form.date.value = t.date;
    if(t.kind==='contra'){
      form.fromAccount.value = t.fromAccount;
      form.toAccount.value = t.toAccount;
    } else {
      if(![...catSelect.options].some(o=>o.value===t.category)){
        const opt = document.createElement('option'); opt.value=t.category; opt.textContent=t.category;
        catSelect.insertBefore(opt, catSelect.lastElementChild);
      }
      catSelect.value = t.category;
      form.account.value = t.account;
    }
    form.amount.value = t.amount;
    form.description.value = t.description||'';
    document.getElementById('txSubmitBtn').textContent = 'Update entry';
    document.getElementById('cancelEditBtn').style.display = 'inline-flex';
    form.scrollIntoView({behavior:'smooth', block:'start'});
  }

  document.getElementById('cancelEditBtn').addEventListener('click', ()=>{
    editingId = null;
    document.getElementById('txForm').reset();
    kindSelect.value = 'expense';
    refreshFields();
    document.getElementById('txSubmitBtn').textContent = 'Save entry';
    document.getElementById('cancelEditBtn').style.display = 'none';
  });

  main.querySelector('tbody').addEventListener('click', e=>{
    const editBtn = e.target.closest('[data-edit]');
    if(editBtn){ startEdit(editBtn.dataset.edit); return; }
    const btn = e.target.closest('[data-del]'); if(!btn) return;
    if(!confirm('Delete this entry?')) return;
    deleteTransaction(btn.dataset.del);
    render();
  });
}

/* ============================= SALES / PURCHASES with GST + inventory link ============================= */
function renderGstTxTab(main, kind, title, subtitle, catGroup){
  const rows = txByKind(kind).sort(byDateThenNewestFirst);
  const monthTotal = rows.filter(t=>isSameMonth(t.date)).reduce((s,t)=>s+txTotal(t),0);
  const cats = state.categories[catGroup];
  const flow = kind==='sale' ? 'in' : 'out';
  const invItems = state.inventoryItems;
  const partyKind = kind==='sale' ? 'client' : 'vendor';
  const partyLabel = kind==='sale' ? 'Client' : 'Vendor';
  const partyList = partyListFor(kind);
  const maxItems = kind==='sale' ? 20 : Infinity;
  const pendingAccountName = kind==='sale' ? RECEIVABLE_ACCOUNT : (kind==='purchase' ? PAYABLE_ACCOUNT : null);
  let editingId = null;

  let lineRowId = 0;
  function lineRowHtml(){
    lineRowId++;
    return `<tr data-line="${lineRowId}">
