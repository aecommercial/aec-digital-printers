        <option value="">— manual / service —</option>
        ${invItems.map(i=>`<option value="${i.id}" data-price="${kind==='sale'?(i.price||i.cost):i.cost}" data-name="${i.name}" data-gst="${i.gstRate!=null?i.gstRate:18}">${i.name} (${fmt(i.qty)} ${i.unit} on hand)</option>`).join('')}
      </select></td>
      <td><input class="lineDesc" placeholder="Description"></td>
      <td class="lineqty"><input class="lineQty" type="number" step="any" value="1"></td>
      <td class="linerate"><input class="lineRate" type="number" step="any" min="0" value="0"></td>
      <td class="lineamt"><input class="lineAmount" type="number" step="any" min="0" value="0"></td>
      <td class="linegst"><select class="lineGst">${GST_RATES.map(r=>`<option value="${r}" ${r===18?'selected':''}>${r}%</option>`).join('')}</select></td>
      <td class="linermv"><button type="button" class="btn ghost small lineRemove" title="Remove line">×</button></td>
    </tr>`;
  }

  main.innerHTML = `
    <div class="topbar"><div><h1 class="disp">${title}</h1><div class="sub">${subtitle}</div></div></div>

    <div class="panel">
      <h2>Add ${title.toLowerCase().replace(/s$/,'')} entry <span class="tag">GST invoice ${maxItems!==Infinity? '· up to '+maxItems+' items':''}</span></h2>
      <form id="txForm">
        <div class="inline">
          <div><label>Date</label><input name="date" type="date" value="${todayISO()}" required id="dateInput"></div>
          ${kind==='sale' ? `<div><label>Sale channel</label>
            <select name="channel" id="channelInput">
              <option value="local-gst">Local — GST invoice</option>
              <option value="local-cash">Local — Cash invoice (no GST)</option>
              <option value="marketplace">Marketplace (Amazon, Flipkart, etc.)</option>
            </select>
          </div>` : ''}
          ${kind==='purchase' ? `<div><label>Purchase channel</label>
            <select name="channel" id="channelInput">
              <option value="local-gst">GST bill</option>
              <option value="local-cash">Cash (no GST)</option>
            </select>
          </div>` : ''}
          <div><label>${kind==='sale'?'Invoice':'Bill'} No.</label>
            ${kind==='sale' ? `<input name="invoiceNo" id="invoiceNoInput" placeholder="e.g. INV-0001"><div class="field-note" id="invoiceNoNote" style="margin:2px 0 0;"></div>` : `<input name="invoiceNo" id="invoiceNoInput" placeholder="e.g. BILL-0001">`}
          </div>
          <div><label>Title / Category</label>
            <select name="category" id="catSelect" required>
              ${cats.map(c=>`<option value="${c}">${c}</option>`).join('')}
              <option value="__new__">＋ Add new title…</option>
            </select>
          </div>
          <div><label>${partyLabel}</label>
            <select id="partySelect">
              <option value="">Walk-in / one-off — type below</option>
              ${partyList.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
              <option value="__new__">＋ Quick add ${partyLabel.toLowerCase()}</option>
            </select>
          </div>
          <div><label>${partyLabel} name</label><input name="description" id="partyNameInput" placeholder="${partyLabel} name"></div>
          <input type="hidden" name="gstin" id="partyGstinInput" value="">
          ${kind==='sale' ? `<div><label>Buyer's state</label>
            <select name="buyerState" id="buyerStateInput">
              <option value="">— select —</option>
              ${INDIA_STATE_LIST.map(s=>`<option value="${s}">${s}</option>`).join('')}
            </select>
          </div>` : ''}
        </div>
        ${kind==='sale' ? `<div class="field-note" id="channelNote">Local GST/Cash invoices are numbered automatically in their own sequence. For Marketplace, type in the order/invoice number Amazon or Flipkart already assigned — it won't touch your local numbering.</div>` : ''}
        ${kind==='purchase' ? `<div class="field-note">Cash bills carry no GST — item lines lock to 0% automatically when this is set to Cash.</div>` : ''}
        ${kind==='sale' ? `<div class="field-note">For marketplace orders (Amazon, Flipkart, etc.), set this to the buyer's delivery state (shown on the order) — it decides CGST+SGST vs IGST, and lets you pull a state-wise sales summary below for GSTR-1 filing.</div>` : ''}
        ${kind==='sale' ? `<div class="field-note">Payment mode isn't asked at entry time — the sale is tracked as pending until you mark it received (from the history table below), then you'll choose Cash or Bank.</div>` : ''}
        ${kind==='purchase' ? `<div class="field-note">Payment mode isn't asked at entry time — the purchase is tracked as pending (owed to the vendor) until you mark it paid (from the history table below), then you'll choose Cash or Bank.</div>` : ''}

        <div style="margin-top:16px;">
          <label style="margin-bottom:6px;">Items ${maxItems!==Infinity?`<span class="muted" style="text-transform:none;font-weight:400;">(max ${maxItems} per ${kind==='sale'?'invoice':'bill'})</span>`:''}</label>
          <table class="line-tbl">
            <thead><tr><th></th><th>Item (optional)</th><th>Description</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th><th class="num" id="gstColHead">GST %</th><th></th></tr></thead>
            <tbody id="linesBody">${lineRowHtml()}</tbody>
          </table>
          <div class="row" style="margin-top:8px;">
            <button type="button" class="btn ghost small" id="addLineBtn">＋ Add item line</button>
            <div class="field-note" id="lineCountNote" style="margin:0;"></div>
          </div>
        </div>

        ${kind==='purchase' ? `<div class="inline" style="margin-top:4px;"><div><label>Round off (${state.currency})</label><input name="roundOff" id="roundOffInput" type="number" step="any" value="0"></div></div>
        <div class="field-note">Adjust the total up or down by a small amount so it matches the vendor's bill exactly (e.g. if their bill total is already rounded). Leave 0 if not needed.</div>` : ''}
        ${kind==='sale' ? `<div class="inline" style="margin-top:4px;"><div><label>Round off (${state.currency})</label><input name="roundOff" id="roundOffInput" type="number" step="any" value="0"></div></div>
        <div class="field-note">Adjust the total up or down by a small amount — it flows into the invoice total, the Sales Register, and outstanding balance. Leave 0 if not needed.</div>` : ''}
        <div class="row" id="gstPreview" style="margin-top:12px;"></div>
        <div class="field-note" id="supplyTypeNote" style="margin-top:4px;"></div>
        <div class="row" style="margin-top:12px;"><button class="btn primary" type="submit" id="txSubmitBtn">Save ${kind==='sale'?'invoice':'bill'}</button><button class="btn ghost" type="button" id="cancelEditBtn" style="display:none;">Cancel edit</button></div>
      </form>
      <div class="field-note">Items linked to inventory adjust stock automatically ${kind==='sale'?'down':'up'} by the quantity entered. ${maxItems!==Infinity?`Need more than ${maxItems} items? Save this one and start a new invoice for the rest.`:''}</div>
    </div>

    <div class="panel">
      <h2>${title} history <span class="tag">${rows.length} entries · this month ${money(monthTotal)}</span></h2>
      <table>
        <thead><tr><th>Date</th><th>${kind==='sale'?'Invoice':'Bill'}</th><th>${partyLabel}</th><th>Items</th><th class="num">Taxable</th><th class="num">GST</th><th class="num">Total</th><th></th></tr></thead>
        <tbody id="historyBody">${rows.length ? rows.map(t=>{
          const lines = txItems(t);
          const gst = (t.cgst||0)+(t.sgst||0)+(t.igst||0);
          const itemsLabel = lines.length>1 ? `${lines.length} items` : (lines[0] && lines[0].name ? lines[0].name : '—');
          const isCreditNote = t.docType==='credit-note';
          const isReturnDoc = t.docType==='credit-note' || t.docType==='debit-note';
          const outstanding = isReturnDoc ? 0 : txOutstanding(t);
          const paid = isReturnDoc ? 0 : paymentsTotal(t);
          let statusHtml, btnLabel;
          if(isReturnDoc){
            statusHtml = '<span class="muted">—</span>';
            btnLabel = null;
          } else if(outstanding<=0.004){
            statusHtml = t.payments ? '<span style="color:var(--good, #1a7f37);">✓ Settled</span>' : '→ '+t.account;
            btnLabel = (t.payments && t.payments.length) ? 'Edit payment' : null;
          } else if(paid>0.004){
            statusHtml = `<span style="color:#b45309;">◐ Partial — ${money(outstanding)} pending</span>`;
            btnLabel = kind==='sale' ? 'Record more payment' : 'Record more payment';
          } else {
            statusHtml = '<span style="color:var(--amber);">● Pending</span>';
            btnLabel = kind==='sale' ? 'Mark received' : 'Mark paid';
          }
          const totalDisplay = isReturnDoc ? `−${money(Math.abs(txTotal(t)))}` : `${t.flow==='in'?'+':'−'}${money(txTotal(t))}`;
          const canReturn = !isReturnDoc && (kind==='sale' || kind==='purchase');
          const menuItems = [
            !isReturnDoc && kind==='sale' ? `<button data-inv="${t.id}">🖨 Invoice</button>` : '',
            isReturnDoc && t.docType==='credit-note' ? `<button data-inv="${t.id}">🖨 Credit Note</button>` : '',
            canReturn ? `<button data-return="${t.id}" data-returnkind="${kind}">↩ ${kind==='sale'?'Sales':'Purchase'} return</button>` : '',
            btnLabel ? `<button data-mark="${t.id}">💰 ${btnLabel}</button>` : '',
            !isReturnDoc ? `<button data-edit="${t.id}">✎ Edit</button>` : '',
            `<button class="danger" data-del="${t.id}">🗑 Delete</button>`
          ].filter(Boolean).join('');
          return `<tr><td class="muted">${dispDate(t.date)}</td><td class="muted">${t.invoiceNo||'—'}${(kind==='sale'||kind==='purchase')?` ${channelBadge(t)}`:''}</td>
          <td>${t.description||'<span class="muted">—</span>'}${t.gstin?`<div class="muted" style="font-size:10.5px;">${t.gstin}</div>`:''}${isReturnDoc?`<div class="muted" style="font-size:10.5px;">Against ${t.refInvoiceNo||'—'}</div>`:''}</td>
          <td class="muted">${itemsLabel}</td>
          <td class="num">${money(t.amount)}</td>
          <td class="num">${money(gst)}</td>
          <td class="num"><span class="pill pill-total ${isReturnDoc?'out':t.flow}">${totalDisplay}</span>
            ${(kind==='sale'||kind==='purchase') ? `<div class="muted" style="font-size:10px; margin-top:2px;">${statusHtml}</div>` : ''}
          </td>
          <td><div class="row-actions"><button class="row-menu-toggle" data-menutoggle="${t.id}" title="Actions">⋯</button><div class="row-menu" id="rowmenu-${t.id}">${menuItems}</div></div></td></tr>`;
        }).join('') : `<tr><td colspan="8" class="empty">No entries yet.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  const catSelect = document.getElementById('catSelect');
  catSelect.addEventListener('change', ()=>{
    if(catSelect.value==='__new__'){
      const name = prompt(`New ${catGroup} title:`);
      if(name && name.trim()){
        const clean = name.trim();
        if(!state.categories[catGroup].includes(clean)){ state.categories[catGroup].push(clean); save(); }
        const opt = document.createElement('option'); opt.value=clean; opt.textContent=clean;
        catSelect.insertBefore(opt, catSelect.lastElementChild);
        catSelect.value = clean;
      } else { catSelect.value = cats[0]; }
    }
  });

  /* Sales only: auto-number the invoice in sequence, asking only for the first invoice of a financial year.
     Local GST and local Cash invoices now share one continuous sequence (only the GST% shown/hidden on
     each line differs between them). Marketplace invoices are numbered by Amazon/Flipkart themselves, so
     we never auto-suggest or touch the local sequence for them — the field is just left open for manual entry. */
  const dateInput = document.getElementById('dateInput');
  const invoiceNoInput = document.getElementById('invoiceNoInput');
  const channelInput = document.getElementById('channelInput');
  function currentLineRowsEls(){ return [...document.getElementById('linesBody').querySelectorAll('tr[data-line]')]; }
  /* Cash channel carries no GST — hide every line's GST% field entirely so it can't be charged by
     accident. Applies to both the sale "Local — Cash" channel and the purchase "Cash" channel.
     GST channel shows the GST% picker back so a rate can be chosen per line. */
  let applyChannelToLines = function(){
    if(!channelInput) return;
    const isCash = channelInput.value==='local-cash';
    const gstColHead = document.getElementById('gstColHead');
    if(gstColHead) gstColHead.style.display = isCash ? 'none' : '';
    currentLineRowsEls().forEach(row=>{
      const gstCell = row.querySelector('.linegst');
      const gstSel = row.querySelector('.lineGst');
      if(gstCell) gstCell.style.display = isCash ? 'none' : '';
      if(!gstSel) return;
      gstSel.disabled = isCash;
      if(isCash) gstSel.value = '0';
    });
    if(typeof updatePreview==='function') updatePreview();
  };
  if(kind==='purchase' && channelInput){
    channelInput.addEventListener('change', applyChannelToLines);
  }
  if(kind==='sale'){
    const invoiceNoNote = document.getElementById('invoiceNoNote');
    function refreshInvoiceNo(){
      if(editingId) return;
      const channel = channelInput.value;
      if(channel==='marketplace'){
        invoiceNoInput.value = '';
        invoiceNoInput.readOnly = false;
        invoiceNoInput.placeholder = 'e.g. Amazon/Flipkart order or invoice number';
        invoiceNoNote.textContent = "Type in the invoice/order number the marketplace already assigned — it won't touch your local invoice sequence.";
        return;
      }
      const series = 'gst'; // local-cash and local-gst share one continuous invoice sequence; only marketplace is separate/manual
      const examplePrefix = 'INV-0001';
      const sugg = suggestInvoiceNo(dateInput.value, series);
      if(sugg){
        invoiceNoInput.value = sugg;
        invoiceNoInput.readOnly = true;
        invoiceNoNote.innerHTML = `Auto-numbered in sequence. <a href="#" id="invoiceNoOverride" style="text-decoration:underline;">Need to change it?</a>`;
        document.getElementById('invoiceNoOverride').addEventListener('click', e=>{
          e.preventDefault();
          invoiceNoInput.readOnly = false;
          invoiceNoInput.focus();
          invoiceNoNote.textContent = 'Overriding the auto-numbered sequence for this entry only.';
        });
      } else {
        invoiceNoInput.value = '';
        invoiceNoInput.readOnly = false;
        invoiceNoInput.placeholder = `First invoice of FY ${fyLabel(financialYearStart(dateInput.value))} — e.g. ${examplePrefix}`;
        invoiceNoNote.textContent = `First invoice of financial year ${fyLabel(financialYearStart(dateInput.value))} — set the number to start from; it'll continue automatically after this, across both Cash and GST invoices.`;
      }
    }
    // applyChannelToLines is defined generically above (covers both sale and purchase cash channels).
    dateInput.addEventListener('change', refreshInvoiceNo);
    channelInput.addEventListener('change', ()=>{ refreshInvoiceNo(); applyChannelToLines(); });
    refreshInvoiceNo();
    // NOTE: not calling applyChannelToLines() here — at this point in setup, `linesBody`/`updatePreview`
    // (defined further down this function) aren't initialized yet, and the default channel is always
    // "local-gst" on a fresh form anyway, so there's nothing to lock yet. It's called later once the
    // rest of the form is wired up (see below), and again inside startEdit() when re-opening a saved entry.
  }

  /* party (client/vendor) select — quick-fill + quick-add */
  const partySelect = document.getElementById('partySelect');
  const partyNameInput = document.getElementById('partyNameInput');
  const partyGstinInput = document.getElementById('partyGstinInput');
  let selectedParty = null;
  const buyerStateInput = document.getElementById('buyerStateInput');
  function applyParty(p){
    selectedParty = p || null;
    partyNameInput.value = p ? p.name : '';
    partyGstinInput.value = p ? (p.gstin||'') : '';
    if(buyerStateInput && p && p.state) buyerStateInput.value = p.state;
    if(typeof updatePreview==='function') updatePreview();
  }
  partySelect.addEventListener('change', ()=>{
    if(partySelect.value==='__new__'){
      openPartyModal(partyKind, null, newId=>{
        const p = findParty(kind, newId);
        const opt = document.createElement('option'); opt.value=newId; opt.textContent=p.name;
        partySelect.insertBefore(opt, partySelect.lastElementChild);
        partySelect.value = newId;
        applyParty(p);
      });
      partySelect.value = selectedParty ? selectedParty.id : '';
      return;
    }
    if(!partySelect.value){ applyParty(null); return; }
    applyParty(findParty(kind, partySelect.value));
  });
  if(buyerStateInput) buyerStateInput.addEventListener('change', ()=>{ if(typeof updatePreview==='function') updatePreview(); });

  /* item lines */
  const linesBody = document.getElementById('linesBody');
  const lineCountNote = document.getElementById('lineCountNote');
  const gstPreview = document.getElementById('gstPreview');
  const supplyTypeNote = document.getElementById('supplyTypeNote');

  function currentLineRows(){ return [...linesBody.querySelectorAll('tr[data-line]')]; }
  function updateLineCountNote(){
    const n = currentLineRows().length;
    lineCountNote.textContent = maxItems===Infinity ? `${n} line(s)` : `${n} / ${maxItems} line(s)`;
  }
  function sumAmount(){
    return currentLineRows().reduce((s,row)=> s + (parseFloat(row.querySelector('.lineAmount').value)||0), 0);
  }
  function lineGstBreakup(){
    // group each line's taxable amount by its own GST rate, then compute tax per group
    const groups = {};
    currentLineRows().forEach(row=>{
      const amt = parseFloat(row.querySelector('.lineAmount').value)||0;
      const rate = parseFloat(row.querySelector('.lineGst').value)||0;
      groups[rate] = (groups[rate]||0) + amt;
    });
    const supplyType = detectSupplyType(partyGstinInput.value, buyerStateInput ? buyerStateInput.value : (selectedParty ? selectedParty.state : null));
    let cgst=0, sgst=0, igst=0;
    Object.keys(groups).forEach(rateKey=>{
      const g = computeGST(groups[rateKey], parseFloat(rateKey), supplyType);
      cgst += g.cgst; sgst += g.sgst; igst += g.igst;
    });
    return { supplyType, cgst:round2(cgst), sgst:round2(sgst), igst:round2(igst), rates: Object.keys(groups).map(Number) };
  }
  function updatePreview(){
    const taxable = round2(sumAmount());
    const g = lineGstBreakup();
    const tax = g.cgst+g.sgst+g.igst;
    gstPreview.innerHTML = g.supplyType==='inter'
      ? `<div class="field-note gst-preview-note">Taxable ${money(taxable)} · IGST ${money(g.igst)} · Total invoice value ${money(taxable+tax)}</div>`
      : `<div class="field-note gst-preview-note">Taxable ${money(taxable)} · CGST ${money(g.cgst)} + SGST ${money(g.sgst)} · Total invoice value ${money(taxable+tax)}</div>`;
    const partyCode = gstStateCode(partyGstinInput.value);
    const bizCode = gstStateCode(state.businessGSTIN);
    const partyStateName = buyerStateInput ? buyerStateInput.value : (selectedParty ? selectedParty.state : '');
    if(bizCode && partyCode){
      supplyTypeNote.textContent = g.supplyType==='inter'
        ? `Inter-state (IGST) — GSTIN shows ${partyCode} ${gstStateName(partyCode)||''}, different from your business state (${bizCode} ${gstStateName(bizCode)||''}).`
        : `Intra-state (CGST+SGST) — GSTIN shows the same state as your business.`;
    } else if(state.homeState && partyStateName){
      supplyTypeNote.textContent = g.supplyType==='inter'
        ? `Inter-state (IGST) — ${partyLabel} is in ${partyStateName}, different from your business state (${state.homeState}).`
        : `Intra-state (CGST+SGST) — ${partyLabel} is in the same state as your business (${state.homeState}).`;
    } else {
      supplyTypeNote.textContent = `Intra-state (CGST+SGST) — assumed (no GSTIN or saved state for this ${partyLabel.toLowerCase()}).`;
    }
  }
  function wireRow(row){
    const itemSel = row.querySelector('.lineItem');
    const descInp = row.querySelector('.lineDesc');
    const qtyInp = row.querySelector('.lineQty');
    const rateInp = row.querySelector('.lineRate');
    const amtInp = row.querySelector('.lineAmount');
    const gstSel = row.querySelector('.lineGst');
    function recalcAmt(){ amtInp.value = round2((parseFloat(qtyInp.value)||0) * (parseFloat(rateInp.value)||0)) || 0; updatePreview(); }
    itemSel.addEventListener('change', ()=>{
      const opt = itemSel.selectedOptions[0];
      const isCash = channelInput && channelInput.value==='local-cash';
      if(itemSel.value){ descInp.value = opt.dataset.name||''; rateInp.value = opt.dataset.price||0; gstSel.value = isCash ? 0 : (opt.dataset.gst||18); recalcAmt(); }
    });
    qtyInp.addEventListener('input', recalcAmt);
    rateInp.addEventListener('input', recalcAmt);
    amtInp.addEventListener('input', updatePreview);
    gstSel.addEventListener('change', updatePreview);
    row.querySelector('.lineRemove').addEventListener('click', ()=>{
      if(currentLineRows().length<=1){ toast('An invoice needs at least one item line.'); return; }
      row.remove(); updateLineCountNote(); updatePreview();
    });
  }
  currentLineRows().forEach(wireRow);
  document.getElementById('addLineBtn').addEventListener('click', ()=>{
    if(currentLineRows().length >= maxItems){ toast(`Max ${maxItems} items on one ${kind==='sale'?'invoice':'bill'} — save this one and start a new ${kind==='sale'?'invoice':'bill'} for the rest.`); return; }
    linesBody.insertAdjacentHTML('beforeend', lineRowHtml());
    wireRow(linesBody.lastElementChild);
    if(channelInput && channelInput.value==='local-cash'){
      const gstCell = linesBody.lastElementChild.querySelector('.linegst');
      const gstSel = linesBody.lastElementChild.querySelector('.lineGst');
      if(gstCell) gstCell.style.display = 'none';
      if(gstSel){ gstSel.disabled = true; gstSel.value = '0'; }
    }
    updateLineCountNote();
  });
  partyGstinInput.addEventListener('input', updatePreview);
  applyChannelToLines();
  updateLineCountNote(); updatePreview();

  document.getElementById('txForm').addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const rowsData = currentLineRows().map(row=>({
      itemId: row.querySelector('.lineItem').value || null,
      name: row.querySelector('.lineDesc').value.trim() || (row.querySelector('.lineItem').selectedOptions[0]?.dataset.name || ''),
      qty: parseFloat(row.querySelector('.lineQty').value)||0,
      rate: parseFloat(row.querySelector('.lineRate').value)||0,
      amount: round2(parseFloat(row.querySelector('.lineAmount').value)||0),
      gstRate: parseFloat(row.querySelector('.lineGst').value)||0
    })).filter(l=> l.amount>0 || l.name);
    if(!rowsData.length){ toast('Add at least one item line with an amount.'); return; }
    for(const l of rowsData){ if(!(l.amount>0)){ toast('Every item line needs an amount greater than 0.'); return; } if(!l.name){ toast('Every item line needs a description.'); return; } }

    const amount = round2(rowsData.reduce((s,l)=>s+l.amount,0));
    if(!amount || amount<=0){ toast('Enter a valid taxable value.'); return; }
    const category = f.get('category')==='__new__' ? cats[0] : f.get('category');
    const saleChannel = (kind==='sale'||kind==='purchase') ? (f.get('channel')||'local-gst') : null;
    const supplyType = detectSupplyType(f.get('gstin'), f.get('buyerState') || (selectedParty ? selectedParty.state : null));
    // group line items by their own GST rate, then compute tax per group and sum
    const rateGroups = {};
    rowsData.forEach(l=>{ rateGroups[l.gstRate] = (rateGroups[l.gstRate]||0) + l.amount; });
    let cgst=0, sgst=0, igst=0;
    Object.keys(rateGroups).forEach(rateKey=>{
      const g = computeGST(rateGroups[rateKey], parseFloat(rateKey), supplyType);
      cgst += g.cgst; sgst += g.sgst; igst += g.igst;
    });
    cgst = round2(cgst); sgst = round2(sgst); igst = round2(igst);
    const rateList = Object.keys(rateGroups).map(Number);
    const gstRate = rateList.length===1 ? rateList[0] : null; // null = mixed rates across items
    const date = f.get('date')||todayISO();
    const roundOff = (kind==='purchase'||kind==='sale') ? round2(parseFloat(f.get('roundOff'))||0) : 0;

    if(editingId){
      const existing = state.transactions.find(x=>x.id==editingId);
      if(!existing){ toast('This entry no longer exists.'); editingId=null; render(); return; }
      const newTotal = amount+cgst+sgst+igst;
      const alreadySettled = paymentsTotal(existing);
      if(alreadySettled>0.004 && round2(newTotal-alreadySettled) < -0.004){
        if(!confirm(`This ${title.toLowerCase().replace(/s$/,'')} already has ${money(alreadySettled)} recorded as paid/discounted, more than the new total of ${money(newTotal)}. Continue anyway?`)) return;
      }
      // reverse the OLD inventory effect, then reapply the NEW one
      const oldLines = (existing.items && existing.items.length) ? existing.items : (existing.itemId ? [{itemId:existing.itemId, qty:existing.qty, rate:existing.amount && existing.qty ? existing.amount/existing.qty : 0}] : []);
      oldLines.forEach(ln=>{
        if(!ln.itemId) return;
        const item = findItem(ln.itemId);
        if(!item) return;
        if(kind==='sale') item.qty += (Number(ln.qty)||0);
        else weightedAvgReverseIn(item, ln.qty, ln.rate);
      });
      state.inventoryMovements = state.inventoryMovements.filter(m=>m.txId!=editingId);
      for(const l of rowsData){
        if(!l.itemId) continue;
        const item = findItem(l.itemId);
        if(!item) continue;
        if(kind==='sale' && item.qty - l.qty < 0){ if(!confirm(`This will take "${item.name}" below zero stock. Continue?`)) return; }
        if(kind==='sale') item.qty -= l.qty; else weightedAvgIn(item, l.qty, l.rate);
        state.inventoryMovements.push({ id: uid(), date, itemId: item.id, type: kind==='sale'?'out':'in', qty: l.qty, rate: kind==='purchase'?l.rate:undefined, note: `Auto: ${title.replace(/s$/,'')} ${f.get('invoiceNo')||''}`.trim(), txId: editingId });
      }
      Object.assign(existing, {
        date, category, amount,
        description: f.get('description')||'', invoiceNo: f.get('invoiceNo')||'', gstin: (f.get('gstin')||'').toUpperCase(),
        partyId: selectedParty ? selectedParty.id : null,
        address: selectedParty ? (selectedParty.address||'') : '',
        contactPerson: selectedParty ? (selectedParty.contactPerson||'') : '',
        contactNumber: selectedParty ? (selectedParty.contactNumber||'') : '',
        items: rowsData,
        gstRate, supplyType, cgst, sgst, igst, buyerState: f.get('buyerState')||'', saleChannel, roundOff
        // account/flow/kind/id intentionally left untouched — editing shouldn't disturb payment status
      });
      save(); toast(`${title.replace(/s$/,'')} entry updated.`);
      editingId = null;
      render();
      return;
    }

    const id = uid();

    for(const l of rowsData){
      if(!l.itemId) continue;
      const item = findItem(l.itemId);
      if(!item) continue;
      if(kind==='sale' && item.qty - l.qty < 0){ if(!confirm(`This will take "${item.name}" below zero stock. Continue?`)) return; }
      if(kind==='sale') item.qty -= l.qty; else weightedAvgIn(item, l.qty, l.rate);
      state.inventoryMovements.push({ id: uid(), date, itemId: item.id, type: kind==='sale'?'out':'in', qty: l.qty, rate: kind==='purchase'?l.rate:undefined, note: `Auto: ${title.replace(/s$/,'')} ${f.get('invoiceNo')||''}`.trim(), txId: id });
    }

    state.transactions.push({
      id, date, kind, category, amount,
      account: kind==='sale' ? RECEIVABLE_ACCOUNT : (kind==='purchase' ? PAYABLE_ACCOUNT : f.get('account')), description: f.get('description')||'', flow,
      invoiceNo: f.get('invoiceNo')||'', gstin: (f.get('gstin')||'').toUpperCase(),
      partyId: selectedParty ? selectedParty.id : null,
      address: selectedParty ? (selectedParty.address||'') : '',
      contactPerson: selectedParty ? (selectedParty.contactPerson||'') : '',
      contactNumber: selectedParty ? (selectedParty.contactNumber||'') : '',
      items: rowsData,
      gstRate, supplyType, cgst, sgst, igst, buyerState: f.get('buyerState')||'', saleChannel, roundOff
    });
    if(kind==='sale'){
      const savedInvoiceNo = f.get('invoiceNo')||'';
      if(savedInvoiceNo && (saleChannel==='local-gst' || saleChannel==='local-cash')){ state.invoiceSettings.lastInvoiceFY = financialYearStart(date); state.invoiceSettings.lastInvoiceNo = savedInvoiceNo; }
      // marketplace invoices are numbered by Amazon/Flipkart — never advance the local sequence
    }
    const grandTotal = amount+cgst+sgst+igst+roundOff;
    save(); toast((kind==='sale') ? `Invoice saved — ${money(grandTotal)} pending receipt` : (kind==='purchase') ? `Bill saved — ${money(grandTotal)} pending payment` : `${title.replace(/s$/,'')} entry saved — ${money(grandTotal)}`);
    render();
  });

  document.getElementById('historyBody').addEventListener('click', e=>{
    const menuToggle = e.target.closest('[data-menutoggle]');
    if(menuToggle){
      const menu = document.getElementById('rowmenu-'+menuToggle.dataset.menutoggle);
      const wasOpen = menu.classList.contains('open');
      document.querySelectorAll('.row-menu.open').forEach(m=>m.classList.remove('open'));
      if(!wasOpen) menu.classList.add('open');
      return;
    }
    const invBtn = e.target.closest('[data-inv]');
    if(invBtn){ openInvoice(invBtn.dataset.inv); return; }
    const returnBtn = e.target.closest('[data-return]');
    if(returnBtn){ openReturnModal(returnBtn.dataset.return, returnBtn.dataset.returnkind); return; }
    const markBtn = e.target.closest('[data-mark]');
    if(markBtn){ openMarkSettledModal(markBtn.dataset.mark); return; }
    const editBtn = e.target.closest('[data-edit]');
    if(editBtn){ startEdit(editBtn.dataset.edit); return; }
    const btn = e.target.closest('[data-del]'); if(!btn) return;
    if(!confirm('Delete this entry? This will also reverse any linked stock movement.')) return;
    deleteTransaction(btn.dataset.del);
    render();
  });
  // Close any open row-action menu when clicking outside it (bound once globally, not per-render)
  if(!window.__rowMenuOutsideClickBound){
    window.__rowMenuOutsideClickBound = true;
    document.addEventListener('click', e=>{
      if(e.target.closest('.row-actions')) return;
      document.querySelectorAll('.row-menu.open').forEach(m=>m.classList.remove('open'));
    });
  }

  function startEdit(txId){
    const t = state.transactions.find(x=>x.id==txId);
    if(!t) return;
    editingId = t.id;
    dateInput.value = t.date;
    invoiceNoInput.value = t.invoiceNo||'';
    invoiceNoInput.readOnly = false;
    const invoiceNoNote = document.getElementById('invoiceNoNote');
    if(invoiceNoNote) invoiceNoNote.textContent = "Editing this entry — its number won't auto-change.";
    if([...catSelect.options].some(o=>o.value===t.category)) catSelect.value = t.category;
    if(channelInput) channelInput.value = t.saleChannel || 'local-gst';
    if(t.partyId){
      const p = findParty(kind, t.partyId);
      if(p && [...partySelect.options].some(o=>o.value==p.id)){ partySelect.value = p.id; applyParty(p); }
      else { partySelect.value=''; selectedParty=null; partyNameInput.value=t.description||''; partyGstinInput.value=t.gstin||''; }
    } else {
      partySelect.value = '';
      selectedParty = null;
      partyNameInput.value = t.description||'';
      partyGstinInput.value = t.gstin||'';
    }
    if(buyerStateInput) buyerStateInput.value = t.buyerState || '';
    const roundOffInput = document.getElementById('roundOffInput');
    if(roundOffInput) roundOffInput.value = t.roundOff || 0;
    linesBody.innerHTML = '';
    txItems(t).forEach(ln=>{
      linesBody.insertAdjacentHTML('beforeend', lineRowHtml());
      const row = linesBody.lastElementChild;
      if(ln.itemId && [...row.querySelector('.lineItem').options].some(o=>o.value==ln.itemId)) row.querySelector('.lineItem').value = ln.itemId;
      row.querySelector('.lineDesc').value = ln.name||'';
      row.querySelector('.lineQty').value = ln.qty!=null ? ln.qty : '';
      row.querySelector('.lineRate').value = ln.rate!=null ? ln.rate : '';
      row.querySelector('.lineAmount').value = ln.amount!=null ? ln.amount : 0;
      row.querySelector('.lineGst').value = ln.gstRate!=null ? ln.gstRate : 18;
      wireRow(row);
    });
    applyChannelToLines();
    updateLineCountNote(); updatePreview();
    document.getElementById('txSubmitBtn').textContent = `Update ${kind==='sale'?'invoice':'bill'}`;
    document.getElementById('cancelEditBtn').style.display = 'inline-flex';
    document.getElementById('txForm').scrollIntoView && document.getElementById('txForm').scrollIntoView({behavior:'smooth', block:'start'});
  }
  document.getElementById('cancelEditBtn').addEventListener('click', ()=>{ editingId=null; render(); });
}

/* ============================= INVENTORY ============================= */
function renderInventory(main){
  const items = [...state.inventoryItems].sort((a,b)=>a.name.localeCompare(b.name));
  const moves = [...state.inventoryMovements].sort(byDateThenNewestFirst).slice(0,15);
  const low = lowStockItems();
  const distinctVals = (field)=> [...new Set(state.inventoryItems.map(i=>i[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const typeOpts = distinctVals('type');
  const brandOpts = distinctVals('brand');
  const colorOpts = distinctVals('color');
  const sizeOpts = distinctVals('size');
  const optsHtml = (arr)=> arr.map(v=>`<option value="${v}">`).join('');
  const usedBytes = storageUsedBytes();
  const usedPct = Math.min(100, round2(usedBytes / ESTIMATED_STORAGE_LIMIT_BYTES * 100));
  const usedMB = (usedBytes/1024/1024).toFixed(2);

  main.innerHTML = `
    <div class="topbar"><div><h1 class="disp">Inventory</h1><div class="sub">Stock on hand, valued at cost.</div></div></div>

    <div class="grid cards">
      <div class="card"><div class="label">Inventory value</div><div class="value num">${money(inventoryValue())}</div><div class="foot">At cost price</div></div>
      <div class="card"><div class="label">Items tracked</div><div class="value num">${items.length}</div><div class="foot">${inventoryUnits()} unit(s) on hand</div></div>
      <div class="card ${low.length?'amber':''}"><div class="label">Low stock</div><div class="value num">${low.length}</div><div class="foot">${low.length? 'At or below reorder level' : 'All items well stocked'}</div></div>
      <div class="card ${usedPct>=70?'amber':''}"><div class="label">Browser storage used</div><div class="value num">${usedMB} MB</div><div class="foot">~${usedPct}% of a typical ${(ESTIMATED_STORAGE_LIMIT_BYTES/1024/1024).toFixed(0)}MB per-site limit — mostly item photos</div></div>
    </div>

    <div class="panel">
      <h2>Add inventory item</h2>
      <form class="inline" id="itemForm">
        <div><label>Item name</label><input name="name" placeholder="e.g. Blue T-Shirt (M)" required></div>
        <div><label>Type</label><input name="type" list="typeList" placeholder="e.g. Stationery" autocomplete="off"></div>
        <div><label>Brand</label><input name="brand" list="brandList" placeholder="e.g. Classmate" autocomplete="off"></div>
        <div><label>Color</label><input name="color" list="colorList" placeholder="e.g. Blue" autocomplete="off"></div>
        <div><label>GSM</label><input name="gsm" type="number" step="any" min="0" placeholder="e.g. 100"></div>
        <div><label>Size</label><input name="size" list="sizeList" placeholder="e.g. A5, A4, 8.5x11 in" autocomplete="off"></div>
        <div><label>Unit</label><input name="unit" placeholder="pcs, kg, box…" value="pcs"></div>
        <div><label>Opening qty</label><input name="qty" type="number" step="any" value="0" required></div>
        <div><label>Unit price (${state.currency})</label><input name="cost" type="number" step="any" min="0" value="0" required></div>
        <div><label>Sale price (${state.currency})</label><input name="price" type="number" step="any" min="0" value="0"></div>
        <div><label>Photos (up to 2)</label><input type="file" id="itemPhotos" accept="image/*" multiple></div>
        <div><button class="btn primary" type="submit">Add item</button></div>
      </form>
      <div class="field-note">Photos are resized and stored only in this browser, for your own reference — up to 2 per item.</div>
      <datalist id="typeList">${optsHtml(typeOpts)}</datalist>
      <datalist id="brandList">${optsHtml(brandOpts)}</datalist>
      <datalist id="colorList">${optsHtml(colorOpts)}</datalist>
      <datalist id="sizeList">${optsHtml(sizeOpts)}</datalist>
    </div>

    <div class="panel">
      <h2>Items <span class="tag">${items.length} item(s)</span></h2>
      <div class="inline" style="margin-bottom:6px;">
        <div><label>Filter by item name</label><input type="text" id="invFilterName" placeholder="Search item name…" autocomplete="off"></div>
        <div><label>Filter by type</label><select id="invFilterType"><option value="">All types</option>${typeOpts.map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div>
      </div>
      <table>
        <thead><tr><th></th><th>Item</th><th>Unit</th><th class="num">Qty on hand</th><th class="num">Unit price</th><th class="num">Sale price</th><th class="num">Value</th><th></th></tr></thead>
        <tbody id="invItemsBody">${items.length ? items.map(i=>{
          const thumb = (i.photos && i.photos.length) ? `<img src="${i.photos[0]}" data-viewphotos="${i.id}" style="width:36px;height:36px;object-fit:cover;border-radius:4px;border:1px solid #ddd;cursor:pointer;" title="${i.photos.length} photo(s) — click to view">` : '';
          const subline = [i.type, i.brand, i.color, i.gsm?`${i.gsm} GSM`:'', i.size].filter(Boolean).join(' • ');
          return `<tr data-item-row data-name="${(i.name||'').toLowerCase().replace(/"/g,'&quot;')}" data-type="${(i.type||'').toLowerCase().replace(/"/g,'&quot;')}"><td style="width:44px;">${thumb}</td><td>${i.name}${subline?`<div class="muted" style="font-size:10.5px;">${subline}</div>`:''}</td><td class="muted">${i.unit||'pcs'}</td>
          <td class="num">${fmt(i.qty)}</td><td class="num">${money(i.cost)}</td><td class="num">${money(i.price||0)}</td><td class="num">${money(itemValue(i))}</td>
          <td><button class="btn ghost small" data-edititem="${i.id}" style="margin-right:4px;">✎ Edit</button><button class="btn ghost small" data-rmitem="${i.id}">Delete</button></td></tr>`;
        }).join('') : `<tr><td colspan="8" class="empty">No items yet — add your first item above.</td></tr>`}
        <tr data-empty-filter style="display:none;"><td colspan="8" class="empty">No items match your filter.</td></tr>
        </tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Record stock movement</h2>
      <form class="inline" id="moveForm">
        <div><label>Date</label><input name="date" type="date" value="${todayISO()}" required></div>
        <div><label>Item</label>
          <select name="itemId" required>${items.map(i=>`<option value="${i.id}">${i.name}</option>`).join('') || '<option value="">Add an item first</option>'}</select>
        </div>
        <div><label>Type</label>
          <select name="type">
            <option value="in">Stock in (purchase / production)</option>
            <option value="out">Stock out (sale / usage)</option>
            <option value="adjust">Adjustment (damage, count correction…)</option>
          </select>
        </div>
        <div><label>Quantity</label><input name="qty" type="number" step="any" required></div>
        <div id="moveRateWrap"><label>Cost per unit (for Stock in)</label><input name="rate" type="number" step="any" min="0" placeholder="Leave blank to keep current cost"></div>
        <div><label>Note (optional)</label><input name="note" placeholder="Reference / party name"></div>
        <div><button class="btn primary" type="submit" ${items.length?'':'disabled'}>Save movement</button></div>
      </form>
      <div class="field-note">"Adjustment" quantity can be positive or negative — use it to correct counts or record damage/loss. This does not create an income or expense entry; log the related sale/purchase separately if money changed hands. For "Stock in", entering the cost per unit blends it into the item's existing stock using weighted-average costing — e.g. 50 units on hand at ₹40 plus 50 new units at ₹45 becomes 100 units at ₹42.50. Leave it blank to add stock at the current cost unchanged.</div>
    </div>

    <div class="panel">
      <h2>Recent stock movements</h2>
      <table>
        <thead><tr><th>Date</th><th>Item</th><th>Type</th><th class="num">Qty</th><th>Note</th><th></th></tr></thead>
        <tbody>${moves.length ? moves.map(m=>{
          const item = findItem(m.itemId);
          const label = m.type==='in' ? 'Stock in' : m.type==='out' ? 'Stock out' : 'Adjustment';
          const sign = m.type==='in' ? '+' : m.type==='out' ? '−' : (m.qty<0?'':'+');
          return `<tr><td class="muted">${dispDate(m.date)}</td><td>${item?item.name:'<span class="muted">(deleted item)</span>'}</td>
          <td class="muted">${label}</td><td class="num"><span class="pill ${m.type==='out'?'out':'in'}">${sign}${fmt(Math.abs(m.qty))}</span></td>
          <td>${m.note||'<span class="muted">—</span>'}</td>
          <td><button class="btn ghost small" data-delmove="${m.id}">Delete</button></td></tr>`;
        }).join('') : `<tr><td colspan="6" class="empty">No stock movements logged yet.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  document.getElementById('itemForm').addEventListener('submit', async e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const name = f.get('name').trim();
    if(!name) return;
    const candidate = { name, type: f.get('type').trim(), brand: f.get('brand').trim(), color: f.get('color').trim(), gsm: f.get('gsm')?parseFloat(f.get('gsm'))||0:0, size: f.get('size').trim(), unit: f.get('unit').trim()||'pcs', cost: parseFloat(f.get('cost'))||0, price: parseFloat(f.get('price'))||0 };
    if(state.inventoryItems.some(i=>itemFingerprint(i)===itemFingerprint(candidate))){ toast('An identical item (same name and same details) already exists.'); return; }
    const photoInput = document.getElementById('itemPhotos');
    const files = photoInput && photoInput.files ? [...photoInput.files].slice(0,2) : [];
    let photos = [];
    if(files.length){
      const submitBtn = e.target.querySelector('button[type=submit]');
      if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Processing photos…'; }
      try{ photos = await Promise.all(files.map(file=>resizeImageFile(file, 480, 0.6))); }
      catch(err){ toast('Could not process one of the photos — item saved without it.'); }
      if(submitBtn){ submitBtn.disabled = false; submitBtn.textContent = 'Add item'; }
    }
    state.inventoryItems.push({
      id: uid(), ...candidate,
      qty: parseFloat(f.get('qty'))||0,
      photos
    });
    save(); toast(`"${name}" added to inventory.`); render();
  });

  main.querySelectorAll('[data-viewphotos]').forEach(img=>{
    img.addEventListener('click', ()=> openPhotoViewer(img.dataset.viewphotos));
  });

  main.querySelectorAll('[data-rmitem]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.rmitem;
      const used = state.inventoryMovements.some(m=>m.itemId==id);
      if(used){ toast("Can't remove this item — it has stock movements against it."); return; }
      if(!confirm('Remove this inventory item?')) return;
      state.inventoryItems = state.inventoryItems.filter(i=>i.id!=id);
      save(); toast('Item removed.'); render();
    });
  });

  main.querySelectorAll('[data-edititem]').forEach(btn=>{
    btn.addEventListener('click', ()=> openItemEditModal(btn.dataset.edititem));
  });

  (function wireInventoryFilters(){
    const nameInp = document.getElementById('invFilterName');
    const typeSel = document.getElementById('invFilterType');
    const body = document.getElementById('invItemsBody');
    if(!nameInp || !body) return;
    function applyFilter(){
      const q = nameInp.value.trim().toLowerCase();
      const t = typeSel.value;
      let anyVisible = false;
      body.querySelectorAll('tr[data-item-row]').forEach(row=>{
        const matches = (!q || row.dataset.name.includes(q)) && (!t || row.dataset.type===t.toLowerCase());
        row.style.display = matches ? '' : 'none';
        if(matches) anyVisible = true;
      });
      const emptyRow = body.querySelector('tr[data-empty-filter]');
      const hasItems = !!body.querySelector('tr[data-item-row]');
      if(emptyRow) emptyRow.style.display = (hasItems && !anyVisible) ? '' : 'none';
    }
    nameInp.addEventListener('input', applyFilter);
    typeSel.addEventListener('change', applyFilter);
  })();

  const moveForm = document.getElementById('moveForm');
  if(moveForm){
    moveForm.addEventListener('submit', e=>{
      e.preventDefault();
      const f = new FormData(e.target);
      const itemId = f.get('itemId');
      const item = findItem(itemId);
      if(!item){ toast('Pick an item first.'); return; }
      let qty = parseFloat(f.get('qty'));
      if(!qty){ toast('Enter a valid quantity.'); return; }
      const type = f.get('type');
      qty = Math.abs(qty);
      const signedQty = type==='out' ? -qty : (type==='in' ? qty : (f.get('qty')<0? -qty : qty));
      if(type==='out' && item.qty - qty < 0){ if(!confirm(`This will take "${item.name}" below zero stock. Continue?`)) return; }
      let usedRate;
      if(type==='in'){
        const enteredRate = parseFloat(f.get('rate'));
        usedRate = isFinite(enteredRate) ? enteredRate : (Number(item.cost)||0);
        weightedAvgIn(item, qty, usedRate);
      } else {
        item.qty += (type==='adjust') ? parseFloat(f.get('qty')) : signedQty;
      }
      state.inventoryMovements.push({ id: uid(), date: f.get('date')||todayISO(), itemId: item.id, type, qty: type==='adjust'? parseFloat(f.get('qty')) : qty, rate: type==='in'?usedRate:undefined, note: f.get('note')||'' });
      save(); toast('Stock movement saved.'); render();
    });
  }

  main.querySelectorAll('[data-delmove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.delmove;
      const m = state.inventoryMovements.find(x=>x.id==id);
      if(!m) return;
      if(!confirm('Delete this stock movement? This will reverse its effect on stock on hand.')) return;
      const item = findItem(m.itemId);
      if(item){
        if(m.type==='in'){
          if(m.rate!=null) weightedAvgReverseIn(item, m.qty, m.rate);
          else item.qty -= m.qty;
        }
        else if(m.type==='out') item.qty += m.qty;
        else item.qty -= m.qty;
      }
      state.inventoryMovements = state.inventoryMovements.filter(x=>x.id!=id);
      save(); toast('Movement deleted.'); render();
    });
  });
}

/* ============================= ACCOUNT LEDGER (for Bank Statement / Cash Register reconciliation) =============================
   Walks every transaction that actually moved money into/out of a given asset account (Cash In Hand,
   Bank Account, or any other cash/bank account added under Settings) and returns a running-balance ledger,
   using each payment's own recorded date so it lines up with the bank statement or cash register entry it
   corresponds to. */
/* ============================= LEDGER (Reports tab — any title, any of the four groups + parties) =============================
   Generalizes the per-account ledger above to Asset/Liability/Equity accounts, Income/Expense titles, and
   Client/Vendor parties, all pickable from one dropdown. RECEIVABLE_ACCOUNT/PAYABLE_ACCOUNT are deliberately
   left out of the Asset/Liability groups here — they're internal "pending" buckets, not real transactable
   accounts, and picking the relevant Client/Vendor gives a much more useful per-invoice view of them anyway. */
function balanceAccountLedger(kind, name){
  const acc = findAcc(kind, name);
  const opening = acc ? (Number(acc.opening)||0) : 0;
  const entries = [];
  if(kind==='asset'){
    state.transactions.forEach(t=>{
      if(t.kind==='sale' && t.payments){ (t.payments||[]).forEach(p=>{ if(p.account===name && p.amount>0) entries.push({date:p.date||t.date, desc:`Received — ${t.description||t.invoiceNo||'Sale'}`, in:Number(p.amount)||0, out:0}); }); return; }
      if(t.kind==='purchase' && t.payments){ (t.payments||[]).forEach(p=>{ if(p.account===name && p.amount>0) entries.push({date:p.date||t.date, desc:`Paid — ${t.description||t.invoiceNo||'Purchase'}`, in:0, out:Number(p.amount)||0}); }); return; }
      if(t.kind==='contra'){ if(t.fromAccount===name) entries.push({date:t.date, desc:`Transfer to ${t.toAccount}${t.description?' — '+t.description:''}`, in:0, out:Number(t.amount)||0}); if(t.toAccount===name) entries.push({date:t.date, desc:`Transfer from ${t.fromAccount}${t.description?' — '+t.description:''}`, in:Number(t.amount)||0, out:0}); return; }
      if((t.kind==='income'||t.kind==='expense') && t.account===name){ const amt=txTotal(t); entries.push({date:t.date, desc:`${t.category}${t.description?' — '+t.description:''}`, in: t.flow==='in'?amt:0, out: t.flow==='out'?amt:0}); }
    });
  } else if(kind==='liability'){
    // Liability accounts (other than the PAYABLE_ACCOUNT bucket) are only ever moved by a Fund Transfer
    // (contra) — purchases always post to PAYABLE_ACCOUNT specifically, never a named liability account
    // directly. A liability behaves OPPOSITE to an asset: money sent TO it (e.g. an EMI's principal) is
    // paying it down (out/decrease); money sourced FROM it (e.g. fresh loan proceeds) is new borrowing
    // (in/increase) — see liabilityBalance() for the matching balance calculation.
    state.transactions.forEach(t=>{
      if(t.kind!=='contra') return;
      if(t.fromAccount===name) entries.push({date:t.date, desc:`Transfer to ${t.toAccount}${t.description?' — '+t.description:''}`, in:Number(t.amount)||0, out:0});
      if(t.toAccount===name) entries.push({date:t.date, desc:`Transfer from ${t.fromAccount}${t.description?' — '+t.description:''}`, in:0, out:Number(t.amount)||0});
    });
  } else {
    // Equity accounts behave OPPOSITE to an asset here, same as Liability above: money sourced FROM the
    // equity account (e.g. a capital top-up) increases it; money sent TO it (e.g. an owner's drawing)
    // decreases it — see equityBalance() for the matching balance calculation.
    state.transactions.forEach(t=>{
      if(t.kind!=='contra') return;
      if(t.fromAccount===name) entries.push({date:t.date, desc:`Transfer to ${t.toAccount}${t.description?' — '+t.description:''}`, in:Number(t.amount)||0, out:0});
      if(t.toAccount===name) entries.push({date:t.date, desc:`Transfer from ${t.fromAccount}${t.description?' — '+t.description:''}`, in:0, out:Number(t.amount)||0});
    });
  }
  entries.sort((a,b)=> new Date(a.date)-new Date(b.date));
  let bal = opening;
  const rows = entries.map(e=>{ bal = round2(bal + e.in - e.out); return {...e, balance:bal}; });
  return {opening, rows, closing:bal};
}
function ledgerGroupOptionsHtml(){
  const opt = (v,label)=> `<option value="${v}">${label}</option>`;
  const assetOpts = state.accounts.asset.filter(a=>a.name!==RECEIVABLE_ACCOUNT).map(a=>opt(`asset::${a.name}`, a.name)).join('');
  const liabOpts = state.accounts.liability.filter(a=>a.name!==PAYABLE_ACCOUNT).map(a=>opt(`liability::${a.name}`, a.name)).join('');
  const eqOpts = state.accounts.equity.map(a=>opt(`equity::${a.name}`, a.name)).join('');

function computeLedgerResultHtml(selValue){

  const sep = selValue.indexOf('::');

  const f = periodFilter(reportRange);

  if(type==='asset' || type==='liability' || type==='equity'){
    const led = balanceAccountLedger(type, key);
    const before = led.rows.filter(r=>!f(r.date));
    const shown = led.rows.filter(r=>f(r.date));
    const openingForPeriod = before.length ? before[before.length-1].balance : led.opening;
    if(!shown.length) return `<div class="empty">No transactions for ${key} in this period. Opening/carried balance: ${money(openingForPeriod)}.</div>`;
    const totalDebit = round2(shown.reduce((s,r)=>s+(r.out||0),0));

    if(!rows.length) return `<div class="empty">No entries under "${key}" in this period.</div>`;
    const total = round2(rows.reduce((s,t)=>s+(Number(t.amount)||0),0));
    return `<table><thead><tr><th>Date</th><th>Source</th><th>Description</th><th class="num">Amount</th></tr></thead>

  if(type==='client' || type==='vendor'){
    const partyKind = type==='client' ? 'sale' : 'purchase';
    const party = findParty(partyKind, key);
    if(!party) return `<div class="empty">This ${type} no longer exists.</div>`;
    // Build a running statement: every invoice/bill (increases balance), every real payment (decreases
    // balance), and every credit/debit note (decreases balance) — shown as its own dated line, even when
    // it didn't create a cash movement (e.g. a return against an already-settled invoice), so the party's
    // true position is always visible. Discount-type payment entries (return write-offs against a still-
    // open invoice) are intentionally skipped here — the credit/debit note line above already represents
    // that same value, so listing both would double-count it.
    const allTx = state.transactions.filter(t=> t.kind===partyKind && t.partyId==key);
    const entries = [];

      entries.push({ date:t.date, desc:`${partyKind==='sale'?'Invoice':'Bill'} ${t.invoiceNo||''}`.trim(), dr:txTotal(t), cr:0, ord:0 });

    allTx.filter(t=>t.docType==='credit-note'||t.docType==='debit-note').forEach(t=>{
      const label = t.docType==='credit-note' ? 'Credit Note' : 'Debit Note';
      const val = Math.abs(txTotal(t));
      entries.push({ date:t.date, desc:`${label} ${t.invoiceNo||''}${t.refInvoiceNo?' (against '+t.refInvoiceNo+')':''}`.trim(), dr:0, cr:val, ord:2 });
    });
    entries.sort((a,b)=> (new Date(a.date)-new Date(b.date)) || (a.ord-b.ord));

    const before = entries.filter(e=>!f(e.date));
    const shown = entries.filter(e=>f(e.date));
    if(!shown.length) return `<div class="empty">No entries for ${party.name} in this period.</div>`;
    const openingForPeriod = before.length ? before[before.length-1].balance : 0;
    const drLabel = partyKind==='sale' ? 'Invoiced' : 'Billed';
    const crLabel = partyKind==='sale' ? 'Received' : 'Paid';
    const totalDr = round2(shown.reduce((s,e)=>s+e.dr,0));
    const totalCr = round2(shown.reduce((s,e)=>s+e.cr,0));
    return `<table><thead><tr><th>Date</th><th>Particulars</th><th class="num">${drLabel}</th><th class="num">${crLabel}</th><th class="num">Balance</th></tr></thead>
    <tbody>

    ${shown.map(e=>`<tr><td class="muted">${dispDate(e.date)}</td><td>${e.desc}</td><td class="num">${e.dr?money(e.dr):''}</td><td class="num">${e.cr?money(e.cr):''}</td><td class="num">${money(e.balance)}</td></tr>`).join('')}
    </tbody>
    <tfoot><tr style="font-weight:700;border-top:2px solid var(--ink);"><td colspan="2">Total</td><td class="num">${money(totalDr)}</td><td class="num">${money(totalCr)}</td><td class="num">${money(shown[shown.length-1].balance)}</td></tr></tfoot>
    </table>
    <div class="field-note">Closing balance shown in the bottom-right cell — positive means the ${type} currently owes ${partyKind==='sale'?'you':'them (or you owe them)'}${partyKind==='sale'?'':', negative means you have a credit with them'}.</div>`;
  }
  return `<div class="empty">Unknown selection.</div>`;
}

function accountLedger(name){
  const acc = findAcc('asset', name);
  const opening = acc ? (Number(acc.opening)||0) : 0;
  const entries = [];
  state.transactions.forEach(t=>{
    if(t.kind==='sale' && t.payments){
      (t.payments||[]).forEach(p=>{ if(p.account===name && p.amount>0) entries.push({date:p.date||t.date, desc:`Received — ${t.description||t.invoiceNo||'Sale'}`, ref:t.invoiceNo||'', in:Number(p.amount)||0, out:0, srcType:'sale-payment', txId:t.id, payId:p.id, viaReconcile:!!p.source}); });
      return;
    }
    if(t.kind==='purchase' && t.payments){
      (t.payments||[]).forEach(p=>{ if(p.account===name && p.amount>0) entries.push({date:p.date||t.date, desc:`Paid — ${t.description||t.invoiceNo||'Purchase'}`, ref:t.invoiceNo||'', in:0, out:Number(p.amount)||0, srcType:'purchase-payment', txId:t.id, payId:p.id, viaReconcile:!!p.source}); });
      return;
    }
    if(t.kind==='contra'){
      if(t.fromAccount===name) entries.push({date:t.date, desc:`Transfer to ${t.toAccount}${t.description?' — '+t.description:''}`, ref:'', in:0, out:Number(t.amount)||0, srcType:'contra', txId:t.id, viaReconcile:!!t.source});
      if(t.toAccount===name) entries.push({date:t.date, desc:`Transfer from ${t.fromAccount}${t.description?' — '+t.description:''}`, ref:'', in:Number(t.amount)||0, out:0, srcType:'contra', txId:t.id, viaReconcile:!!t.source});
      return;
    }
    if((t.kind==='income'||t.kind==='expense') && t.account===name){
      const amt = txTotal(t);
      entries.push({date:t.date, desc:`${t.category}${t.description?' — '+t.description:''}`, ref:'', in: t.flow==='in'?amt:0, out: t.flow==='out'?amt:0, srcType:t.kind, txId:t.id, viaReconcile:!!t.source});
    }
  });
  entries.sort((a,b)=> (new Date(a.date)-new Date(b.date)) || 0);
  let bal = opening;
  const rows = entries.map(e=>{ bal = round2(bal + e.in - e.out); return {...e, balance:bal}; });
  return {opening, rows, closing:bal};
}

/* Edit/delete a single ledger row from the Reports account-ledger view. Key is srcType::txId::payId::account
   (payId empty for contra/income/expense). Payment-type rows only touch that one payment on the invoice —
   the invoice itself, and any other payments against it, are left alone. */
function parseLedgerKey(key){ const [srcType, txId, payId, account] = key.split('::'); return {srcType, txId, payId: payId||null, account}; }
function deleteLedgerRow(key){
  const {srcType, txId, payId} = parseLedgerKey(key);
  if(srcType==='sale-payment' || srcType==='purchase-payment'){
    const tx = state.transactions.find(x=>x.id==txId); if(!tx) return;
    if(!confirm('Remove this payment from the invoice? The invoice itself will stay — only this payment entry is deleted.')) return;
    tx.payments = (tx.payments||[]).filter(p=>p.id!=payId);
    save(); toast('Payment entry deleted.'); render(); return;
  }
  if(!confirm('Delete this entry?')) return;
  deleteTransaction(txId); render();
}
function editLedgerRow(key){
  const {srcType, txId, payId} = parseLedgerKey(key);
  if(srcType==='sale-payment' || srcType==='purchase-payment'){
    const tx = state.transactions.find(x=>x.id==txId); if(!tx) return;
    const p = (tx.payments||[]).find(x=>x.id==payId); if(!p) return;
    const newDate = prompt('Payment date:', p.date||tx.date); if(newDate===null) return;
    const newAmt = prompt('Payment amount:', p.amount); if(newAmt===null) return;
    const amt = parseFloat(newAmt);
    if(!amt || amt<=0){ toast('Enter a valid amount.'); return; }
    p.date = newDate.trim()||p.date; p.amount = round2(amt);
    save(); toast('Payment updated.'); render(); return;
  }
  const t = state.transactions.find(x=>x.id==txId); if(!t) return;
  const newDate = prompt('Date:', t.date); if(newDate===null) return;
  const newAmt = prompt('Amount:', t.amount); if(newAmt===null) return;
  const amt = parseFloat(newAmt);
  if(!amt || amt<=0){ toast('Enter a valid amount.'); return; }
  const newDesc = prompt('Description:', t.description||''); if(newDesc===null) return;
  t.date = newDate.trim()||t.date; t.amount = round2(amt); t.description = newDesc.trim();
  save(); toast('Entry updated.'); render();
}

/* ============================= CASH FLOW ============================= */
let cfRange = 'month';
let cfGroup = 'week';
/* Every rupee that actually moved into/out of a cash or bank account (not accrual sales/purchases),
   merged across all cash/bank accounts with a running combined balance — the real answer to
   "do I have enough cash", as opposed to Profit & Loss, which counts a sale the day it's invoiced
   even if payment hasn't landed yet. */
function cashFlowMovements(){
  const accs = cashBankAccounts();
  let opening = 0;
  const entries = [];
  accs.forEach(a=>{
    const led = accountLedger(a.name);
    opening += led.opening;
    led.rows.forEach(r=> entries.push({date:r.date, in:r.in, out:r.out}));
  });
  entries.sort((a,b)=> new Date(a.date)-new Date(b.date));
  let bal = opening;
  const rows = entries.map(e=>{ bal = round2(bal + e.in - e.out); return {...e, balance:bal}; });
  return {opening, rows, closing:bal};
}
/* Monday of the week containing dateStr, as YYYY-MM-DD — the grouping key for weekly buckets. */
function weekStart(dateStr){
  const d = new Date(dateStr);
  const day = d.getDay();
  const diff = day===0 ? -6 : 1-day;
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function weekLabel(startStr){
  const s = new Date(startStr); const e = new Date(s); e.setDate(s.getDate()+6);
  const opts = {day:'2-digit', month:'short'};
  return `${s.toLocaleDateString('en-IN',opts)} – ${e.toLocaleDateString('en-IN',opts)}`;
}
function monthLabel(key){
  const [y,m] = key.split('-');
  return new Date(Number(y), Number(m)-1, 1).toLocaleDateString('en-IN',{month:'long', year:'numeric'});
}
/* Groups the combined cash ledger into weekly or monthly buckets within the selected range, carrying
   a running opening/closing balance across buckets — computed from the FULL history first, so the
   opening figure for the very first bucket shown is accurate no matter which range is selected. */
function cashFlowPeriods(range, groupBy){
  const led = cashFlowMovements();
  const f = periodFilter(range);
  const shown = led.rows.filter(r=>f(r.date));
  const before = led.rows.filter(r=>!f(r.date));
  let runningOpen = before.length ? before[before.length-1].balance : led.opening;
  if(!shown.length) return {periods:[], opening:runningOpen};
  const buckets = {};
  shown.forEach(r=>{
    const key = groupBy==='week' ? weekStart(r.date) : r.date.slice(0,7);
    if(!buckets[key]) buckets[key] = {key, in:0, out:0};
    buckets[key].in += r.in; buckets[key].out += r.out;
  });
  const keys = Object.keys(buckets).sort();
  const openingForRange = runningOpen;
  const periods = keys.map(k=>{
    const b = buckets[k];
    const opening = runningOpen;
    const net = round2(b.in - b.out);
    const closing = round2(opening + net);
    runningOpen = closing;
    return {key:k, label: groupBy==='week'?weekLabel(k):monthLabel(k), opening, in:round2(b.in), out:round2(b.out), net, closing};
  });
  return {periods, opening: openingForRange};
}
/* Cash-in and cash-out grouped by category, counted on the date cash actually moved (a part-payment's
   own date), not the invoice date — so a sale invoiced last month but paid today shows as cash-in
   today. Fund transfers between your own cash/bank accounts are left out since they're not real
   income or expense — they net to zero across the combined accounts anyway. */
function cashCategoryBreakdown(range){
  const f = periodFilter(range);
  const names = cashBankAccounts().map(a=>a.name);
  const inCats = {}, outCats = {};
  state.transactions.forEach(t=>{
    if(t.kind==='sale' && t.payments){
      t.payments.forEach(p=>{ if(names.includes(p.account) && p.amount>0 && f(p.date||t.date)) inCats[t.category] = round2((inCats[t.category]||0) + Number(p.amount)); });
    } else if(t.kind==='purchase' && t.payments){
      t.payments.forEach(p=>{ if(names.includes(p.account) && p.amount>0 && f(p.date||t.date)) outCats[t.category] = round2((outCats[t.category]||0) + Number(p.amount)); });
    } else if((t.kind==='income'||t.kind==='expense') && names.includes(t.account) && f(t.date)){
      const amt = txTotal(t);
      if(t.flow==='in') inCats[t.category] = round2((inCats[t.category]||0)+amt);
      else outCats[t.category] = round2((outCats[t.category]||0)+amt);
    }
  });
  return {inCats, outCats};
}
function renderCategoryList(cats, flowClass){
  const entries = Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  if(!entries.length) return `<div class="empty">None this period.</div>`;
  return `<table><tbody>${entries.map(([cat,amt])=>`<tr><td>${cat}</td><td class="num" style="width:110px;"><span class="pill ${flowClass}">${money(amt)}</span></td></tr>`).join('')}</tbody></table>`;
}

function stateWiseSalesSummary(){
  const rows = txByKind('sale').filter(t=>periodFilter(reportRange)(t.date)).filter(t=>(t.saleChannel||'local-gst')!=='local-cash');
  const byState = {};
  rows.forEach(t=>{
    const key = t.buyerState || 'Not specified';
    if(!byState[key]) byState[key] = {taxable:0, cgst:0, sgst:0, igst:0, invoices:0};
    const b = byState[key];
    b.taxable += Number(t.amount)||0; b.cgst += t.cgst||0; b.sgst += t.sgst||0; b.igst += t.igst||0; b.invoices += 1;
  });
  return Object.entries(byState).map(([state,v])=>({
    state, invoices:v.invoices, taxable:round2(v.taxable), cgst:round2(v.cgst), sgst:round2(v.sgst), igst:round2(v.igst),
    total: round2(v.taxable+v.cgst+v.sgst+v.igst)
  })).sort((a,b)=>b.total-a.total);
}

/* Renders one side (Dr or Cr / Assets or Liabilities) of a horizontal T-format statement: a simple
   Particulars/Amount table with a bold total row. Shared by Trading Account, P&L, and (indirectly,
   via its own markup) the Balance Sheet below. */
function renderTAccountSide(side, title, rows, totalLabel, totalValue, totalColor){
  return `<div class="t-side t-${side}">
    <div class="section-title" style="text-align:left;">${title}</div>
    <table>
      <thead><tr><th>Particulars</th><th class="num">Amount</th></tr></thead>
      <tbody>
        ${rows.length ? rows.map(r=>`<tr><td>${r.label}</td><td class="num">${money(r.value)}</td></tr>`).join('') : `<tr><td class="muted">Nothing this period</td><td></td></tr>`}
      </tbody>
      <tfoot><tr><td>${totalLabel}</td><td class="num" style="${totalColor?`color:${totalColor};`:''}">${money(totalValue)}</td></tr></tfoot>
    </table>
  </div>`;
}
function renderTradingAccount(range){
  const opening = openingStockValue(range);
  const purchases = purchasesTotal(range);
  const closing = closingStockValue();
  const cogs = opening + purchases - closing;
  const sales = salesTotal(range);
  const gross = sales - cogs;
  const closingIsAsOfToday = periodEndDate(range) === todayISO();

  const drRows = [
    {label:'To Opening Stock', value:opening},
    {label:'To Purchases', value:purchases}
  ];
  const crRows = [
    {label:'By Sales', value:sales},
    {label:`By Closing Stock${closingIsAsOfToday?'':' (as of today)'}`, value:closing}
  ];
  if(gross>=0) drRows.push({label:'To Gross Profit c/d', value:gross});
  else crRows.push({label:'By Gross Loss c/d', value:-gross});
  const drTotal = round2(drRows.reduce((s,r)=>s+r.value,0));
  const crTotal = round2(crRows.reduce((s,r)=>s+r.value,0));

  return `<div class="t-format">
    ${renderTAccountSide('left','Dr', drRows, 'Total', drTotal)}
    ${renderTAccountSide('right','Cr', crRows, 'Total', crTotal)}
  </div>
  <div class="field-note">Opening Stock is reconstructed from your stock movement history as it stood at the start of the period; Closing Stock is always your current stock on hand as of today${closingIsAsOfToday?'':`, since ${dispDate(periodEndDate(range))} is in the past and the app doesn't keep a day-by-day stock ledger`}. Purchases and Sales are the invoice totals recorded in this period (Purchases/Sales tabs). ${gross>=0?'Gross Profit':'Gross Loss'} carries down to the Profit &amp; Loss account, which also includes any non-trading income/expenses.</div>`;
}
function renderPnL(){
  const f = periodFilter(reportRange);
  const tx = state.transactions.filter(t=>f(t.date));
  const incomeByCat = {};
  const expenseByCat = {};
  tx.forEach(t=>{
    if(t.kind==='sale'||t.kind==='income') incomeByCat[t.category] = (incomeByCat[t.category]||0)+t.amount;
    if(t.kind==='purchase'||t.kind==='expense') expenseByCat[t.category] = (expenseByCat[t.category]||0)+t.amount;
  });
  // Zero-value categories (no net activity in the period, or entries that exactly offset) are left
  // off the statement — a category isn't worth a line if it shows ₹0.
  const inc = Object.entries(incomeByCat).filter(([,v])=>isNonZero(v));
  const exp = Object.entries(expenseByCat).filter(([,v])=>isNonZero(v));
  const totalInc = inc.reduce((s,[,v])=>s+v,0), totalExp = exp.reduce((s,[,v])=>s+v,0);
  const profit = totalInc-totalExp;

  const drRows = exp.map(([c,v])=>({label:`To ${c}`, value:v}));
  const crRows = inc.map(([c,v])=>({label:`By ${c}`, value:v}));
  if(profit>=0) drRows.push({label:'To Net Profit c/d', value:profit});
  else crRows.push({label:'By Net Loss c/d', value:-profit});
  const drTotal = round2(drRows.reduce((s,r)=>s+r.value,0));
  const crTotal = round2(crRows.reduce((s,r)=>s+r.value,0));

  return `<div class="t-format">
    ${renderTAccountSide('left','Dr (Expenses)', drRows, 'Total', drTotal)}
    ${renderTAccountSide('right','Cr (Income)', crRows, 'Total', crTotal)}
  </div>`;
}

function receivablesByParty(){
  const map = new Map();
  txByKind('sale').forEach(t=>{
    const out = txOutstanding(t);
    if(out<=0.004) return;
    const party = t.partyId ? findParty('sale', t.partyId) : null;
    const key = party ? ('c'+party.id) : ('u'+t.id);
    const name = party ? party.name : (t.description || t.invoiceNo || ('Invoice #'+t.id));
    if(!map.has(key)) map.set(key, {name, amount:0});
    map.get(key).amount += out;
  });
  return Array.from(map.values()).sort((a,b)=>b.amount-a.amount);
}
function payablesByParty(){
  const map = new Map();
  txByKind('purchase').forEach(t=>{
    const out = txOutstanding(t);
    if(out<=0.004) return;
    const party = t.partyId ? findParty('purchase', t.partyId) : null;
    const key = party ? ('v'+party.id) : ('u'+t.id);
    const name = party ? party.name : (t.description || ('Purchase #'+t.id));
    if(!map.has(key)) map.set(key, {name, amount:0});
    map.get(key).amount += out;
  });
  return Array.from(map.values()).sort((a,b)=>b.amount-a.amount);
}
/* Zero-balance accounts are left off the printed balance sheet entirely (line AND its subheading,
   if that empties it out) — a classic accountant convention that keeps the statement to what's
   actually outstanding, rather than a template listing every account at ₹0. A tiny epsilon avoids
   floating-point dust (e.g. 0.0000001) counting as a real balance. */
const BS_ZERO_EPS = 0.005;
const isNonZero = (n)=> Math.abs(n) > BS_ZERO_EPS;

function renderBalanceSheet(){
  const rawAssets = state.accounts.asset.map(a=>({name:a.name, bal:assetBalance(a.name), subtitle:a.subtitle}));
  if(state.inventoryItems.length) rawAssets.push({name:'Inventory (at cost)', bal:inventoryValue(), subtitle:'Inventory / Stock-in-Trade'});
  const rawLiabilities = state.accounts.liability.map(a=>({name:a.name, bal:liabilityBalance(a.name), subtitle:a.subtitle}));
  const netGst = netGSTPayable('all');
  if(netGst>0) rawLiabilities.push({name:'GST Payable (net, to date)', bal:netGst, subtitle:'GST Payable'});
  else if(netGst<0) rawAssets.push({name:'GST Input Credit (net, to date)', bal:-netGst, subtitle:'GST Input Credit'});
  const equity = state.accounts.equity.map(a=>({name:a.name, bal:equityBalance(a.name), subtitle:a.subtitle}));
  const retained = netProfit('all');

  // Everything below is computed on the FULL (unfiltered) lists, so totals always tie out correctly —
  // only the on-screen presentation hides ₹0 lines/subheadings, per line item.
  const totalAssets = rawAssets.reduce((s,a)=>s+a.bal,0);
  const totalLiab = rawLiabilities.reduce((s,a)=>s+a.bal,0);
  const totalEquity = equity.reduce((s,a)=>s+a.bal,0) + retained;

  const breakdownRows = (rows)=> rows.length ? rows.map(r=>`<div class="line sub" style="padding-left:24px; font-size:12px;"><span>${r.name}</span><span class="num">${money(r.amount)}</span></div>`).join('') : `<div class="line sub muted" style="padding-left:24px; font-size:12px;"><span>Nothing pending</span><span></span></div>`;
  const assetLine = (a)=>{
    if(a.name===RECEIVABLE_ACCOUNT){
      return `<details class="acc-breakdown"><summary class="line sub"><span>${a.name}</span><span class="num">${money(a.bal)}</span></summary><div class="breakdown-list">${breakdownRows(receivablesByParty())}</div></details>`;
    }
    return `<div class="line sub"><span>${a.name}</span><span class="num">${money(a.bal)}</span></div>`;
  };
  const liabLine = (a)=>{
    if(a.name===PAYABLE_ACCOUNT){
      return `<details class="acc-breakdown"><summary class="line sub"><span>${a.name}</span><span class="num">${money(a.bal)}</span></summary><div class="breakdown-list">${breakdownRows(payablesByParty())}</div></details>`;
    }
    return `<div class="line sub"><span>${a.name}</span><span class="num">${money(a.bal)}</span></div>`;
  };
  const plainLine = (a)=>`<div class="line sub"><span>${a.name}</span><span class="num">${money(a.bal)}</span></div>`;

  // A vertical, classified balance sheet: rows are grouped under whatever Subtitle each account was
  // given in Settings → Balance sheet accounts (an account with no subtitle set falls under "Other"),
  // in the order those subtitles first appear among the accounts. Any group with nothing non-zero in
  // it is skipped entirely, and so is any individual ₹0 line within a group.
  const groupBySubtitle = (rows)=>{
    const order = []; const groups = {};
    rows.filter(r=>isNonZero(r.bal)).forEach(r=>{
      const key = (r.subtitle||'').trim() || 'Other';
      if(!groups[key]){ groups[key]=[]; order.push(key); }
      groups[key].push(r);
    });
    return order.map(title=>({title, rows:groups[title]}));
  };
  const assetGroups = groupBySubtitle(rawAssets);
  const liabGroups = groupBySubtitle(rawLiabilities);
  const equityRows = equity.slice();
  if(isNonZero(retained)) equityRows.push({name:'Retained Earnings (net profit to date)', bal:retained, subtitle:'Capital & Reserves'});
  const equityGroups = groupBySubtitle(equityRows);

  const renderGroups = (groups, lineFn)=> groups.map(g=>{
    const subtotal = g.rows.reduce((s,a)=>s+a.bal,0);
    return `<div class="section-title" style="font-size:12px; margin-top:10px;">${g.title}</div>
      ${g.rows.map(lineFn).join('')}
      <div class="line sub" style="font-weight:700; border-top:1px solid var(--rule); margin-top:2px;"><span>Total ${g.title}</span><span class="num">${money(subtotal)}</span></div>`;
  }).join('');

  return `<div class="t-format">
    <div class="t-side t-left statement">
      <div class="section-title" style="text-align:left;">Assets</div>
      ${assetGroups.length ? renderGroups(assetGroups, assetLine) : '<div class="line sub muted"><span>No asset accounts</span><span></span></div>'}
      <div class="line total"><span>Total Assets</span><span class="num">${money(totalAssets)}</span></div>
    </div>
    <div class="t-side t-right statement">
      <div class="section-title" style="text-align:left;">Capital &amp; Liabilities</div>
      ${equityGroups.length ? renderGroups(equityGroups, plainLine) : ''}
      ${liabGroups.length ? renderGroups(liabGroups, liabLine) : ''}
      ${!equityGroups.length && !liabGroups.length ? '<div class="line sub muted"><span>No liability or equity accounts</span><span></span></div>' : ''}
      <div class="line total"><span>Total Capital &amp; Liabilities</span><span class="num">${money(totalLiab+totalEquity)}</span></div>
    </div>
  </div>
  <div class="field-note">Accounts with a ₹0 balance are left off this statement. Click ${RECEIVABLE_ACCOUNT} or ${PAYABLE_ACCOUNT} to expand and see the pending amount for each client/vendor. The groupings above come straight from the Subtitle you set for each account in Settings → Balance sheet accounts — an account with no subtitle shows under "Other". Liability and equity balances update when you edit their opening balance in Settings (e.g. after taking a loan), or via a Fund Transfer to/from a Liability/Equity account (e.g. an EMI's principal, an owner's drawing) — day-to-day sales, purchases, expenses and income update automatically.</div>`;
}

  if(contraRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(contraRows), 'Fund Transfers');
