      ...led.rows.map(r=>({Date:dispDate(r.date), Particulars:r.desc, Ref:r.ref||'', Debit:r.out||'', Credit:r.in||'', Balance:r.balance}))
    ];
    const sheetName = (a.name.length>26 ? a.name.slice(0,26) : a.name) + ' Ledger';
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), sheetName.slice(0,31));
  });
  const out = outputGST('all'), inp = inputGST('all');
  const gstRows = [
    {Head:'Output GST — CGST', Amount:out.cgst}, {Head:'Output GST — SGST', Amount:out.sgst}, {Head:'Output GST — IGST', Amount:out.igst},
    {Head:'Total Output GST', Amount:gstTotal(out)},
    {Head:'Input GST — CGST', Amount:inp.cgst}, {Head:'Input GST — SGST', Amount:inp.sgst}, {Head:'Input GST — IGST', Amount:inp.igst},
    {Head:'Total Input GST (ITC)', Amount:gstTotal(inp)},
    {Head:'Net GST Payable / (Credit)', Amount:gstTotal(out)-gstTotal(inp)}
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(gstRows), 'GST Summary');
  const stateRows = (()=>{
    const byState = {};
    txByKind('sale').filter(t=>(t.saleChannel||'local-gst')!=='local-cash').forEach(t=>{
      const key = t.buyerState || 'Not specified';
      if(!byState[key]) byState[key] = {taxable:0, cgst:0, sgst:0, igst:0, invoices:0};
      const b = byState[key];
      b.taxable += Number(t.amount)||0; b.cgst += t.cgst||0; b.sgst += t.sgst||0; b.igst += t.igst||0; b.invoices += 1;
    });
    return Object.entries(byState).map(([st,v])=>({
      'Buyer State':st, Invoices:v.invoices, Taxable:round2(v.taxable), CGST:round2(v.cgst), SGST:round2(v.sgst), IGST:round2(v.igst),
      Total: round2(v.taxable+v.cgst+v.sgst+v.igst)
    })).sort((a,b)=>b.Total-a.Total);
  })();
  if(stateRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stateRows), 'State-wise Sales');
  if(state.inventoryItems.length){
    const invRows = state.inventoryItems.map(i=>({Item:i.name, Type:i.type||'', Brand:i.brand||'', Color:i.color||'', GSM:i.gsm||'', Size:i.size||'', Unit:i.unit, 'Qty on hand':i.qty, 'Unit price':i.cost, 'Sale price':i.price||0, Value:itemValue(i)}));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(invRows), 'Inventory');
    const moveRows = state.inventoryMovements.map(m=>({Date:dispDate(m.date), Item:(findItem(m.itemId)||{}).name||'', Type:m.type, Qty:m.qty, Note:m.note}));
    if(moveRows.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(moveRows), 'Stock Movements');
  }
  const bsRows = [];
  state.accounts.asset.forEach(a=>{ const b=assetBalance(a.name); if(isNonZero(b)) bsRows.push({Category:(a.subtitle||'Other'), Account:a.name, Balance:b}); });
  if(state.inventoryItems.length && isNonZero(inventoryValue())) bsRows.push({Category:'Inventory / Stock-in-Trade', Account:'Inventory (at cost)', Balance:inventoryValue()});
  state.accounts.liability.forEach(a=>{ const b=liabilityBalance(a.name); if(isNonZero(b)) bsRows.push({Category:(a.subtitle||'Other'), Account:a.name, Balance:b}); });
  state.accounts.equity.forEach(a=>{ const b=equityBalance(a.name); if(isNonZero(b)) bsRows.push({Category:(a.subtitle||'Capital & Reserves'), Account:a.name, Balance:b}); });
  if(isNonZero(netProfit('all'))) bsRows.push({Category:'Capital & Reserves', Account:'Retained Earnings (net profit to date)', Balance:netProfit('all')});
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(bsRows), 'Balance Sheet');
  XLSX.writeFile(wb, `${state.businessName.replace(/[^a-z0-9]+/gi,'-')}-books-${todayISO()}.xlsx`);
  toast('Excel file downloaded.');
}

/* ============================= RECONCILE ============================= */
/* Working state for the tab — deliberately NOT saved to localStorage. A loaded statement is scratch
   data until you approve individual lines; approving a line writes a real transaction/payment via the
   normal functions (save()), same as entering it by hand. Reloading the page clears anything you
   haven't approved yet — nothing half-done is ever silently kept. */
let reconcile = { account: null, statement: null, lines: [] };

/* Statement file format (a small .json you load here) — produced for you by pasting/uploading a bank
   statement in chat: { "account":"Bank Account", "period":{"from":"2026-04-01","to":"2026-04-30"},
   "openingBalance":5, "closingBalance":1784.94, "entries":[ {"date":"2026-04-06","desc":"...","in":10,"out":0,"ref":"..."} ] } */
function matchStatementToBooks(account, entries){
  const bookRows = accountLedger(account).rows.map((r,i)=>({...r, _i:i}));
  const used = new Set();
  return entries.map((e,idx)=>{
    const amt = Number(e.in)||0 ? {dir:'in', amt:Number(e.in)} : {dir:'out', amt:Number(e.out)||0};
    let hit = bookRows.find(r=> !used.has(r._i) && r.date===e.date && Math.abs((amt.dir==='in'?r.in:r.out) - amt.amt) < 0.005 && (amt.dir==='in'?r.in>0:r.out>0));
    if(!hit){
      const eDate = new Date(e.date);
      hit = bookRows.find(r=>{
        if(used.has(r._i)) return false;
        const rAmt = amt.dir==='in'?r.in:r.out;
        if(rAmt<=0 || Math.abs(rAmt-amt.amt)>=0.005) return false;
        return Math.abs(new Date(r.date)-eDate) <= 3*86400000;
      });
    }
    if(hit) used.add(hit._i);
    return { id:idx, date:e.date, desc:e.desc||'', ref:e.ref||'', in:Number(e.in)||0, out:Number(e.out)||0,
      status: hit ? 'matched' : 'review', matchDesc: hit ? hit.desc : null, approvedNote:null };
  });
}
/* Entries added via the Reconcile tab (source:'reconcile') for a given cash/bank account — either whole
   income/expense/contra transactions, or individual payments sitting inside a sale/purchase invoice.
   Used to let a user "redo" a reconciliation without touching invoices or manually-entered payments. */
function reconcileTaggedItems(account){
  const items = [];
  state.transactions.forEach(t=>{
    if((t.kind==='income'||t.kind==='expense') && t.account===account && t.source==='reconcile') items.push({type:'tx', txId:t.id});
    else if(t.kind==='contra' && (t.fromAccount===account||t.toAccount===account) && t.source==='reconcile') items.push({type:'tx', txId:t.id});
    else if((t.kind==='sale'||t.kind==='purchase') && t.payments){
      t.payments.forEach(p=>{ if(p.account===account && p.source==='reconcile') items.push({type:'payment', txId:t.id, payId:p.id}); });
    }
  });
  return items;
}
function countReconcileTagged(account){ return reconcileTaggedItems(account).length; }
function clearReconcileTagged(account){
  const items = reconcileTaggedItems(account);
  items.forEach(it=>{
    if(it.type==='tx') deleteTransaction(it.txId);
    else {
      const tx = state.transactions.find(x=>x.id==it.txId);
      if(tx) tx.payments = (tx.payments||[]).filter(p=>p.id!=it.payId);
    }
  });
  save();
}

function renderReconcile(main){
  const accounts = cashBankAccounts();
  if(!reconcile.account) reconcile.account = accounts[0] ? accounts[0].name : null;
  const matched = reconcile.lines.filter(l=>l.status==='matched').length;
  const review = reconcile.lines.filter(l=>l.status==='review').length;
  const approved = reconcile.lines.filter(l=>l.status==='approved').length;

  main.innerHTML = `
    <div class="topbar"><div><h1 class="disp">Reconcile</h1><div class="sub">Load a bank/cash statement, see what's already in your books, and approve what's missing — line by line.</div></div></div>
    <div class="panel">
      <h2>Load a statement</h2>
      <div class="inline">
        <div><label>Account</label>
          <select id="rcAccount">${accounts.map(a=>`<option value="${a.name}" ${a.name===reconcile.account?'selected':''}>${a.name}</option>`).join('')}</select>
        </div>
        <div><label>Statement file (.json)</label>
          <button type="button" class="btn ghost" id="rcLoadBtn">⬆ Load statement</button>
          <input type="file" id="rcFile" accept="application/json" style="display:none;">
        </div>
        ${reconcile.statement ? `<div><label>&nbsp;</label><button type="button" class="btn ghost" id="rcClearBtn">✕ Clear loaded statement</button></div>` : ''}
      </div>
      <div class="field-note">Since this app can't read a PDF directly, send the bank statement to Claude in chat first — it'll hand you back a small .json file to load here.</div>
    </div>
    ${reconcile.account ? (()=>{ const n = countReconcileTagged(reconcile.account); return n ? `
    <div class="panel">
      <h2>Redo a reconciliation <span class="tag">${n} entr${n===1?'y':'ies'} added via Reconcile for ${reconcile.account}</span></h2>
      <div class="field-note" style="margin-bottom:10px;">This removes only the income/expense/transfer entries and invoice-payment lines that were added <em>through this Reconcile tab</em> for ${reconcile.account}. Your invoices and any payments logged directly from Sales/Purchases are left untouched. Use this before re-loading a statement, so old approvals don't cause double entries.</div>
      <button type="button" class="btn danger small" id="rcClearReconciledBtn">🧹 Clear ${n} Reconcile-added entr${n===1?'y':'ies'} for ${reconcile.account}</button>
    </div>` : ''; })() : ''}
    ${!reconcile.statement ? `<div class="panel"><div class="empty">No statement loaded yet for ${reconcile.account||'this account'}.</div></div>` : `
    <div class="grid cards">
      <div class="card"><div class="label">Statement period</div><div class="value" style="font-size:16px;">${dispDate(reconcile.statement.period.from)} – ${dispDate(reconcile.statement.period.to)}</div></div>
      <div class="card"><div class="label">Matched</div><div class="value num">${matched}</div></div>
      <div class="card ${review?'amber':''}"><div class="label">To review</div><div class="value num">${review}</div></div>
      <div class="card"><div class="label">Approved this session</div><div class="value num">${approved}</div></div>
    </div>
    <div class="panel">
      <h2>Statement lines</h2>
      <div id="rcLines" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>`}
  `;

  document.getElementById('rcAccount').addEventListener('change', e=>{ reconcile.account = e.target.value; reconcile.statement=null; reconcile.lines=[]; render(); });
  document.getElementById('rcLoadBtn').addEventListener('click', ()=> document.getElementById('rcFile').click());
  if(document.getElementById('rcClearBtn')) document.getElementById('rcClearBtn').addEventListener('click', ()=>{ reconcile.statement=null; reconcile.lines=[]; render(); });
  if(document.getElementById('rcClearReconciledBtn')) document.getElementById('rcClearReconciledBtn').addEventListener('click', ()=>{
    const n = countReconcileTagged(reconcile.account);
    if(!confirm(`Delete ${n} entr${n===1?'y':'ies'} added via Reconcile for ${reconcile.account}? Invoices and their non-Reconcile payments stay untouched. This can't be undone.`)) return;
    clearReconcileTagged(reconcile.account);
    reconcile.statement=null; reconcile.lines=[];
    toast(`Cleared ${n} Reconcile-added entr${n===1?'y':'ies'}.`);
    render();
  });
  document.getElementById('rcFile').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!Array.isArray(data.entries)) throw new Error('bad format');
        reconcile.statement = { period: data.period||{from:data.entries[0]?.date, to:data.entries[data.entries.length-1]?.date}, openingBalance:data.openingBalance, closingBalance:data.closingBalance };
        reconcile.lines = matchStatementToBooks(reconcile.account, data.entries);
        toast(`Loaded ${data.entries.length} lines.`);
        render();
      }catch(err){ toast("Couldn't read that file — make sure it's a statement .json."); }
    };
    reader.readAsText(file);
  });

  if(reconcile.statement) renderReconcileLines();
}

function renderReconcileLines(){
  const wrap = document.getElementById('rcLines');
  if(!wrap) return;
  wrap.innerHTML = '';
  reconcile.lines.forEach(line=>{
    const card = document.createElement('div');
    card.style.cssText = 'background:var(--card); border:1px solid var(--rule); border-radius:10px; padding:10px 14px;';
    const amt = line.in>0 ? `+ ${money(line.in)}` : `- ${money(line.out)}`;
    const amtColor = line.in>0 ? 'var(--accent)' : 'var(--bad)';
    let statusPill = '';
    if(line.status==='matched') statusPill = `<span class="pill" style="background:var(--accent-soft);color:var(--accent);">Matched</span>`;
    else if(line.status==='approved') statusPill = `<span class="pill" style="background:var(--accent-soft);color:var(--accent);">Approved</span>`;
    else statusPill = `<span class="pill" style="background:var(--amber-soft);color:var(--amber);">Needs review</span>`;
    card.innerHTML = `<div style="display:flex; justify-content:space-between; align-items:center; gap:12px; cursor:${line.status==='review'?'pointer':'default'};">
      <div><div>${line.desc||'—'}</div><div class="muted" style="font-size:12px; margin-top:2px;">${dispDate(line.date)}${line.ref?' · '+line.ref:''}</div></div>
      <div style="text-align:right;"><div style="font-weight:600; color:${amtColor};">${amt}</div><div style="margin-top:4px;">${statusPill}</div></div>
    </div><div class="rcDetail" style="display:none; margin-top:10px; padding-top:10px; border-top:1px solid var(--rule);"></div>`;
    wrap.appendChild(card);
    const detail = card.querySelector('.rcDetail');
    if(line.status==='matched'){
      detail.style.display='block';
      detail.innerHTML = `<div class="muted" style="font-size:13px;">✓ Matches: ${line.matchDesc}</div>`;
      return;
    }
    if(line.status==='approved'){
      detail.style.display='block';
      detail.innerHTML = `<div class="muted" style="font-size:13px;">✓ Added to your books${line.approvedNote?' — '+line.approvedNote:''}</div>`;
      return;
    }
    card.firstElementChild.addEventListener('click', ()=>{ detail.style.display = detail.style.display==='none'?'block':'none'; });
    detail.innerHTML = reconcileActionHtml(line);
    wireReconcileAction(detail, line);
  });
}

function reconcileActionHtml(line){
  const kind = line.in>0 ? 'in' : 'out';
  const cats = kind==='in' ? state.categories.income : state.categories.expense;
  return `
    <div class="inline">

function wireReconcileAction(detail, line){
  const typeSel = detail.querySelector('.rcType');
  const catField = detail.querySelector('.rcCatField');
  const invArea = detail.querySelector('.rcInvoiceArea');
  const remarkInp = detail.querySelector('.rcRemark');

  function refreshType(){
    const t = typeSel.value;
    catField.style.display = (t==='income'||t==='expense') ? '' : 'none';
    if(t==='invoices'){
      invArea.innerHTML = `<div class="inline"><div style="flex:1;"><label>Client / party name contains</label><input type="text" class="rcParty" placeholder="e.g. part of the payer's name" value="${(line.desc.match(/[A-Za-z][A-Za-z .]{2,}/)||[''])[0].trim()}"></div></div><div class="rcInvoiceList" style="margin-top:8px;"></div>`;
      const partyInp = invArea.querySelector('.rcParty');
      const listEl = invArea.querySelector('.rcInvoiceList');
      function refreshInvoices(){
        const q = partyInp.value.trim().toLowerCase();
        const open = txByKind('sale').filter(t=> txOutstanding(t)>0.004 && (!q || (t.description||'').toLowerCase().includes(q)));
        if(!open.length){ listEl.innerHTML = `<div class="muted" style="font-size:13px;">No open invoices match that name.</div>`; return; }
        listEl.innerHTML = open.map(t=>`<div style="display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--paper); border-radius:8px; padding:6px 10px; margin-bottom:6px;">
          <label style="display:flex; align-items:center; gap:8px; font-size:13px;"><input type="checkbox" class="rcInvChk" data-id="${t.id}"> ${t.invoiceNo||'#'+t.id} <span class="muted" style="font-size:12px;">${money(txOutstanding(t))} outstanding</span></label>
          <input type="number" step="any" class="rcInvAmt" data-id="${t.id}" value="0" style="width:110px;">
        </div>`).join('');
        listEl.querySelectorAll('.rcInvChk').forEach(chk=>{
          chk.addEventListener('change', ()=>{
            const amtInp = listEl.querySelector(`.rcInvAmt[data-id="${chk.dataset.id}"]`);
            const t = open.find(x=>x.id==chk.dataset.id);
            if(chk.checked) autoSplit(); else amtInp.value = 0;
          });
        });
        function autoSplit(){
          let remaining = line.in;
          listEl.querySelectorAll('.rcInvChk').forEach(chk=>{
            const amtInp = listEl.querySelector(`.rcInvAmt[data-id="${chk.dataset.id}"]`);
            if(!chk.checked){ amtInp.value = 0; return; }
            const t = open.find(x=>x.id==chk.dataset.id);
            const alloc = Math.max(0, Math.min(txOutstanding(t), remaining));
            amtInp.value = round2(alloc);
            remaining = round2(remaining - alloc);
          });
        }
      }
      partyInp.addEventListener('input', refreshInvoices);
      refreshInvoices();
    } else {
      invArea.innerHTML = '';
    }
  }
  typeSel.addEventListener('change', refreshType);
  refreshType();

  detail.querySelector('.rcApprove').addEventListener('click', ()=>{
    const t = typeSel.value;
    const remark = remarkInp.value.trim();
    if(t==='invoices'){
      const checks = [...invArea.querySelectorAll('.rcInvChk:checked')];
      if(!checks.length){ toast('Tick at least one invoice.'); return; }
      let total = 0;
      const allocations = checks.map(chk=>{
        const amtVal = round2(parseFloat(invArea.querySelector(`.rcInvAmt[data-id="${chk.dataset.id}"]`).value)||0);
        total = round2(total+amtVal);
        return { id: chk.dataset.id, amt: amtVal };
      });
      if(Math.abs(total-line.in) > 0.01){ toast(`Allocated ${money(total)} but the payment is ${money(line.in)} — adjust the amounts so they add up.`); return; }
      allocations.forEach(a=>{
        const tx = state.transactions.find(x=>x.id==a.id);
        if(tx && a.amt>0){ tx.payments = tx.payments||[]; tx.payments.push({ id:uid(), date:line.date, amount:a.amt, account:reconcile.account, discount:0, source:'reconcile' }); }
      });
      save();
      line.status='approved'; line.approvedNote = `Settled ${allocations.length} invoice(s)`;
      toast('Invoices settled.'); renderReconcileLines(); return;
    }
    if(t==='income'||t==='expense'){
      const category = detail.querySelector('.rcCategory').value;
      state.transactions.push({ id:uid(), date:line.date, kind:t, category, description:remark, amount: t==='income'?line.in:line.out, account:reconcile.account, flow: t==='income'?'in':'out', source:'reconcile' });
      save(); line.status='approved'; line.approvedNote = `${t==='income'?'Income':'Expense'} · ${category}`;
      toast('Added to your books.'); renderReconcileLines(); return;
    }
    if(t==='drawing'||t==='capital'){
      const eqAccount = state.accounts.equity[0] ? state.accounts.equity[0].name : "Owner's Capital";
      const fromAccount = t==='drawing' ? reconcile.account : eqAccount;
      const toAccount = t==='drawing' ? eqAccount : reconcile.account;
      const amount = t==='drawing' ? line.out : line.in;
      state.transactions.push({ id:uid(), date:line.date, kind:'contra', fromAccount, toAccount, amount, description:remark, source:'reconcile' });
      save(); line.status='approved'; line.approvedNote = t==='drawing' ? "Owner's drawing" : "Owner's capital";
      toast('Added to your books.'); renderReconcileLines(); return;
    }
  });
}

      state.transactions.forEach(t=>{
        const isIncomeKind = (t.kind==='sale'||t.kind==='income');
        const isExpenseKind = (t.kind==='purchase'||t.kind==='expense');
        if(group==='income' && isIncomeKind && t.category===name) t.category = v;
        if(group==='expense' && isExpenseKind && t.category===name) t.category = v;
      });
      save(); toast(`Updated to "${v}".`); drawCatChips(group, group==='income'?'incomeChips':'expenseChips');
      return;
    }
    const btn = e.target.closest('[data-rmcat]'); if(!btn) return;
    const [group, name] = btn.dataset.rmcat.split('::');
    if(catUsed(group,name)){ toast(`Can't remove "${name}" — it's used by existing entries.`); return; }
    state.categories[group] = state.categories[group].filter(c=>c!==name);
    save(); drawCatChips(group, group==='income'?'incomeChips':'expenseChips');
  });

  function drawAccChips(kind, elId){
    const el = document.getElementById(elId);
    const suggestions = [...new Set(state.accounts[kind].map(a=>a.subtitle).filter(Boolean))];
    const datalistId = kind+'SubtitleList';
    const datalistHtml = `<datalist id="${datalistId}">${suggestions.map(s=>`<option value="${s}">`).join('')}</datalist>`;
    el.innerHTML = datalistHtml + state.accounts[kind].map(a=>{
      const bal = kind==='asset' ? assetBalance(a.name) : (kind==='liability' ? liabilityBalance(a.name) : a.opening);
      return `<div class="chip acc">${a.name}
        <input class="subtitle-input" data-subtitle="${kind}::${a.name}" list="${datalistId}" value="${a.subtitle||''}" placeholder="Subtitle" title="Groups this account on the Balance Sheet" style="width:105px;font-size:10.5px;padding:2px 6px;border-radius:10px;border:1px solid var(--rule);background:var(--amber-soft);color:var(--amber);">
        <span class="bal" data-editbal="${kind}::${a.name}" style="cursor:pointer; text-decoration:underline dotted;">${money(bal)}</span>
        <button data-editaccname="${kind}::${a.name}" title="Edit title" style="background:var(--accent-soft); color:var(--accent);">✎</button>
        <button data-rmacc="${kind}::${a.name}" title="Remove">×</button>
      </div>`;
    }).join('');
  }
  drawAccChips('asset','assetChips'); drawAccChips('liability','liabChips'); drawAccChips('equity','eqChips');

  function addAccHandler(kind, nameId, balId, chipsId, subtitleId){
    const name = document.getElementById(nameId).value.trim();
    const opening = parseFloat(document.getElementById(balId).value) || 0;
    if(!name) return;
    if(state.accounts[kind].some(a=>a.name.toLowerCase()===name.toLowerCase())){ toast('That account already exists.'); return; }
    const acc = {name, opening};
    if(subtitleId) acc.subtitle = document.getElementById(subtitleId).value.trim();
    state.accounts[kind].push(acc);
    save(); document.getElementById(nameId).value=''; document.getElementById(balId).value=''; if(subtitleId) document.getElementById(subtitleId).value='';
    drawAccChips(kind, chipsId);
  }
  document.getElementById('addAssetAcc').addEventListener('click', ()=>addAccHandler('asset','newAssetAcc','newAssetBal','assetChips','newAssetSubtitle'));
  document.getElementById('addLiabAcc').addEventListener('click', ()=>addAccHandler('liability','newLiabAcc','newLiabBal','liabChips','newLiabSubtitle'));
  document.getElementById('addEqAcc').addEventListener('click', ()=>addAccHandler('equity','newEqAcc','newEqBal','eqChips','newEqSubtitle'));

  main.addEventListener('change', e=>{
    const si = e.target.closest('.subtitle-input');
    if(si){
      const [kind, name] = si.dataset.subtitle.split('::');
      const acc = findAcc(kind, name);
      if(acc){ acc.subtitle = si.value.trim(); save(); }
      drawAccChips(kind, kind==='asset'?'assetChips':kind==='liability'?'liabChips':'eqChips');
    }
  });

  main.addEventListener('click', e=>{
    const rm = e.target.closest('[data-rmacc]');
    if(rm){
      const [kind, name] = rm.dataset.rmacc.split('::');
      const used = state.transactions.some(t=> t.account===name || t.fromAccount===name || t.toAccount===name);
      if(used){ toast(`Can't remove "${name}" — it has transactions against it.`); return; }
      state.accounts[kind] = state.accounts[kind].filter(a=>a.name!==name);
      save(); drawAccChips(kind, kind==='asset'?'assetChips':kind==='liability'?'liabChips':'eqChips');
      return;
    }
    const ean = e.target.closest('[data-editaccname]');
    if(ean){
      const [kind, name] = ean.dataset.editaccname.split('::');
      if(name===RECEIVABLE_ACCOUNT || name===PAYABLE_ACCOUNT){ toast('This account is used automatically for pending invoices and can\'t be renamed.'); return; }
      const acc = findAcc(kind, name);
      const newName = prompt('Correct the title:', name);
      if(newName===null) return;
      const v = newName.trim();
      if(!v || v===name) return;
      if(state.accounts[kind].some(a=>a.name.toLowerCase()===v.toLowerCase())){ toast('That account already exists.'); return; }
      acc.name = v;
      state.transactions.forEach(t=>{ if(t.account===name) t.account = v; });
      save(); toast(`Updated to "${v}".`); drawAccChips(kind, kind==='asset'?'assetChips':kind==='liability'?'liabChips':'eqChips');
      return;
    }
    const eb = e.target.closest('[data-editbal]');
    if(eb){
      const [kind, name] = eb.dataset.editbal.split('::');
      const acc = findAcc(kind, name);
      const label = kind==='asset' ? 'opening balance (before any sales/purchases entries)' : 'current balance';
      const val = prompt(`Set ${label} for "${name}":`, acc.opening);
      if(val===null) return;
      const num = parseFloat(val);
      if(isNaN(num)){ toast('Enter a valid number.'); return; }
      acc.opening = num; save(); toast(`${name} updated.`);
      drawAccChips(kind, kind==='asset'?'assetChips':kind==='liability'?'liabChips':'eqChips');
    }
  });

  document.getElementById('exportJsonBtn').addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `${state.businessName.replace(/[^a-z0-9]+/gi,'-')}-backup-${todayISO()}.json`; a.click();
  });
  document.getElementById('importJsonBtn').addEventListener('click', ()=> document.getElementById('importJsonFile').click());
  document.getElementById('importJsonFile').addEventListener('change', e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try{
        const data = JSON.parse(ev.target.result);
        if(!data.categories) throw new Error('bad file');
        if(!data.inventoryItems) data.inventoryItems = [];
        if(!data.inventoryMovements) data.inventoryMovements = [];
        if(data.businessGSTIN===undefined) data.businessGSTIN = '';
        if(data.homeState===undefined) data.homeState = '';
        if(!data.invoiceSettings) data.invoiceSettings = seedState().invoiceSettings;
        if(data.invoiceSettings.lastInvoiceFY===undefined) data.invoiceSettings.lastInvoiceFY = null;
        if(data.invoiceSettings.lastInvoiceNo===undefined) data.invoiceSettings.lastInvoiceNo = '';
        if(data.invoiceSettings.lastCashInvoiceFY===undefined) data.invoiceSettings.lastCashInvoiceFY = null;
        if(data.invoiceSettings.lastCashInvoiceNo===undefined) data.invoiceSettings.lastCashInvoiceNo = '';
        if(!data.clients) data.clients = [];
        if(!data.vendors) data.vendors = [];
        if(!data.accounts.asset.some(a=>a.name===RECEIVABLE_ACCOUNT)) data.accounts.asset.push({name:RECEIVABLE_ACCOUNT, opening:0});
        if(!data.accounts.liability.some(a=>a.name===PAYABLE_ACCOUNT)) data.accounts.liability.push({name:PAYABLE_ACCOUNT, opening:0});
        if(!confirm('This replaces all current data with the backup file. Continue?')) return;
        state = data; save(); toast('Backup restored.'); render();
      }catch(err){ toast('Could not read that file — is it an Accounts Book backup?'); }
    };
    reader.readAsText(file);
  });

  document.getElementById('resetBtn').addEventListener('click', ()=>{
    if(!confirm('This erases everything and starts a brand-new business ledger. This cannot be undone. Continue?')) return;
    state = seedState(); save(); toast('Starting fresh.'); render();
  });
}

/* ============================= INIT ============================= */
if(!state.onboarded){
  const name = prompt('Welcome! What is this business called?', state.businessName);
  if(name && name.trim()) state.businessName = name.trim();
  state.onboarded = true;
}
try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
applySavedTheme();
applyFontChoice();
render();
initGoogleAuth();
</script>
</body>
</html>
